 $('#v-main').querySelectorAll('.scen button').forEach(b=>b.onclick=()=>{SCEN=b.dataset.s;renderPano();});
 $('#v-main').querySelectorAll('.chip').forEach(b=>b.onclick=()=>openSvc(b.dataset.svc));
 $('#v-main').querySelectorAll('.chain .node').forEach(b=>b.onclick=()=>{
   $('#v-main').querySelectorAll('.chain .node').forEach(n=>n.classList.remove('on'));
   b.classList.add('on');
   const note=s.notes&&s.notes[+b.dataset.i];
   document.getElementById('pano-step-cap').innerHTML=note?md(note):'';
 });
 $('#v-main').querySelectorAll('.unit-nav button').forEach(b=>b.onclick=()=>go(b.dataset.u));
}

/* ---------- mega overview ---------- */
function renderMega(){
 const mapSrc='graph/AWS_Knowledge_Map_'+(LANG==='en'?'EN':'ZH')+'.png';
 const cardsSrc='graph/AWS_Quick_Reference_Cards_'+(LANG==='en'?'EN':'ZH')+'.png';
 $('#v-main').innerHTML=`
 <div class="eyebrow">${T(I18N.megaEyebrow)}</div>
 <h1>${T(I18N.megaTitle)}</h1>
 <p class="lede">${T(I18N.megaLede)}</p>
 <div class="diagram-card"><div class="diagram-canvas-real">${diagMega()}</div></div>
 <div class="diagram-card">
   <div class="diagram-tag"><em>${T(I18N.megaMapTag)}</em></div>
   <div class="diagram-canvas-real"><img src="${mapSrc}" alt="${T(I18N.megaMapTitle)}" style="display:block;width:100%;height:auto;border-radius:8px"></div>
   <div class="diagram-body"><b>${T(I18N.megaMapTitle)}</b><p>${md(I18N.megaMapLede)}</p></div>
 </div>
 <div class="diagram-card">
   <div class="diagram-tag"><em>${T(I18N.megaCardsTag)}</em></div>
   <div class="diagram-canvas-real"><img src="${cardsSrc}" alt="${T(I18N.megaCardsTitle)}" style="display:block;width:100%;height:auto;border-radius:8px"></div>
   <div class="diagram-body"><b>${T(I18N.megaCardsTitle)}</b><p>${md(I18N.megaCardsLede)}</p></div>
 </div>
 <div class="unit-nav">
   <button class="prev" data-u="pano"><span>${T(I18N.prevUnit)}</span><b>${T(I18N.views.pano)}</b></button>
   <button class="next" data-u="quiz"><span>${T(I18N.nextUnit)}</span><b>${T(I18N.views.quiz)}</b></button>
 </div>`;
 $('#v-main').querySelectorAll('.unit-nav button').forEach(b=>b.onclick=()=>go(b.dataset.u));
}

/* ---------- search (cross-unit) ---------- */
function renderSearch(){
 let html=`<div class="eyebrow">${T(I18N.searchEyebrow)}</div><h1>${T(I18N.searchTitle)}</h1>`;
 let hits=0;
 UNITS.forEach(u=>{
  const list=u.services.filter(s=>{
    const hay=(s.n+T(s.t)+T(s.d)+T(s.c)).toLowerCase();
    return hay.includes(Q);});
  if(!list.length) return;
  hits+=list.length;
  html+=`<div class="mod">
   <div class="mod-head"><em>${u.num}</em><b>${T(u.t)}</b></div>
   <div class="cards">${list.map(cardHtml).join('')}</div>
  </div>`;
 });
 if(!hits) html+=`<div class="panel">${T(I18N.noHit)}</div>`;
 $('#v-main').innerHTML=html;
 $('#v-main').querySelectorAll('.card').forEach(b=>b.onclick=()=>openSvc(b.dataset.svc));
}

/* ---------- drawer ---------- */
function openSvc(name){
 const s=SVC[name];
 if(!s){return;}
 $('#dName').textContent=svcTitle(s);
 $('#dTag').textContent=T(s.t);
 const sib=s._m.services.filter(x=>x.n!==s.n).slice(0,6);
 $('#dBody').innerHTML=`
  <h5>${stars(s.s)} · ${T(s._m.t)}</h5>
  ${s.why?`<h5>${T(I18N.why)}</h5><p>${md(s.why)}</p>`:''}
  <h5>${T(I18N.desc)}</h5><p>${md(s.d)}</p>
  ${s.pit?`<h5>${T(I18N.pit)}</h5><p>${md(s.pit)}</p>`:''}
  <h5>${T(I18N.caseL)}</h5><div class="case">${md(s.c)}</div>
  <h5>${T(I18N.related)}</h5><div class="rel">${sib.map(x=>`<button data-svc="${esc(x.n)}">${esc(svcTitle(x))}</button>`).join('')}</div>`;
 $('#dBody').querySelectorAll('button').forEach(b=>b.onclick=()=>openSvc(b.dataset.svc));
 $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}
function closeDrawer(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');}

/* ---------- quiz ---------- */
let ANS={}, PICK={};
function renderQuiz(){
 const a=Object.keys(ANS).length, c=Object.values(ANS).filter(Boolean).length;
 $('#v-main').innerHTML=`<div class="eyebrow">${T(I18N.navSummary)} · Self-test</div><h1>${T(I18N.quizTitle)}</h1>
  <p class="lede">${T(I18N.quizLede)}</p>
  <div class="quiz-top"><span class="score">${T(I18N.score).replace('{a}',a).replace('{t}',QUIZ.length).replace('{c}',c)}</span>
   <button class="pill" id="qreset">${T(I18N.reset)}</button></div>`+
  QUIZ.map((q,i)=>{
   const done=i in ANS;
   return `<div class="q-card"><div class="qn">${String(i+1).padStart(2,'0')} · ${q.w.toUpperCase()}</div>
    <div class="qt">${md(q.q)}</div>
    <div class="opts">${q.o.map((o,j)=>{
      let cls='';
      if(done){ if(j===q.a) cls='right'; else if(PICK[i]===j) cls='wrong';}
      return `<button class="opt ${cls}" data-q="${i}" data-o="${j}" ${done?'disabled':''}><span>${'ABCD'[j]}</span>${esc(o)}</button>`;}).join('')}</div>
    <div class="exp ${done?'on':''}">${md(q.e)}</div></div>`;}).join('')+
  `<div class="unit-nav"><button class="prev" data-u="mega"><span>${T(I18N.prevUnit)}</span><b>${T(I18N.megaTitle)}</b></button><span></span></div>`;
 $('#v-main').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const i=+b.dataset.q,j=+b.dataset.o;
   PICK[i]=j;ANS[i]=(j===QUIZ[i].a);renderQuiz();});
 $('#qreset').onclick=()=>{ANS={};PICK={};renderQuiz();};
 $('#v-main').querySelectorAll('.unit-nav button').forEach(b=>b.onclick=()=>go(b.dataset.u));
}

/* ---------- shell ---------- */
function renderAll(){
 document.documentElement.setAttribute('lang',LANG==='zh'?'zh-CN':'en');
 document.documentElement.setAttribute('data-lang',LANG);
 $('.brand b').textContent=T(I18N.brand);
 $('#brandSub').textContent=T(I18N.brandSub);
 $('#q').placeholder=T(I18N.search);
 renderRail();renderMain();
 $('#foot').textContent=T(I18N.foot);
}
function setLang(l){LANG=l;$('#zhBtn').setAttribute('aria-pressed',l==='zh');$('#enBtn').setAttribute('aria-pressed',l==='en');renderAll();}
$('#zhBtn').onclick=()=>setLang('zh');
$('#enBtn').onclick=()=>setLang('en');
$('#themeBtn').onclick=()=>{
 const d=document.documentElement.getAttribute('data-theme')==='dark';
 document.documentElement.setAttribute('data-theme',d?'light':'dark');};
$('#dClose').onclick=closeDrawer;
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{
  Q=e.target.value.trim().toLowerCase();
  renderMain();},180);});
renderAll();

</script>
</body>
</html>
