<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS AIP-C01 · 阶段一复习台 / Phase 1 Review Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F6; --grid:#D8E0EA; --card:#FFFFFF; --card2:#F7F9FC;
  --ink:#0D1626; --ink2:#4C5B72; --ink3:#7C8AA0; --line:#C9D3E0;
  --net:#1D4ED8; --net-soft:#E3EAFD;
  --ai:#6D28D9; --ai-soft:#EEE7FD;
  --star:#C2820B; --warn:#B45309; --warn-soft:#FDF1DF; --ok:#0A7A5A;
  --shadow:0 1px 0 rgba(13,22,38,.04), 0 10px 30px -18px rgba(13,22,38,.35);
}
[data-theme="dark"]{
  --paper:#0A111E; --grid:#16223A; --card:#111C2E; --card2:#0E1828;
  --ink:#E8EEF7; --ink2:#9DAFC7; --ink3:#6D7F98; --line:#243350;
  --net:#7DA5FF; --net-soft:#152244;
  --ai:#B79BFF; --ai-soft:#1E1738;
  --star:#E0A93C; --warn:#E0A257; --warn-soft:#2A1F10; --ok:#4CC79E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
code,.mono,.kbd{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--net)}
::selection{background:var(--net-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--net);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.search{position:relative}
.search input{
  width:230px;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;font-weight:600;
  padding:6px 13px;cursor:pointer;letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:14px}
.icon-btn:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- layout ---------- */
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:26px;padding:22px 20px 90px}
.rail{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;padding-right:4px}
.rail h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  margin:16px 0 7px;font-family:"IBM Plex Mono",monospace}
.rail h4:first-child{margin-top:0}
.rail a{display:flex;justify-content:space-between;gap:8px;align-items:center;text-decoration:none;color:var(--ink2);
  padding:5px 9px;border-radius:7px;font-size:13.5px;border-left:2px solid transparent}
.rail a:hover{background:var(--card);color:var(--ink)}
.rail a.on{background:var(--card);color:var(--ink);font-weight:600;border-left-color:var(--net);box-shadow:var(--shadow)}
.rail a i{font-style:normal;font-size:10.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
main{min-width:0}
section.view{display:none}
section.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- headings ---------- */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
h1{font-size:31px;line-height:1.15;letter-spacing:-.025em;margin:4px 0 8px;font-weight:700}
h2{font-size:20px;letter-spacing:-.015em;margin:34px 0 12px;font-weight:700;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:15.5px;margin:20px 0 8px;font-weight:600}
.lede{color:var(--ink2);max-width:74ch;margin:0 0 18px}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:11px 14px;font-size:13px;color:var(--ink2);margin:14px 0}
.note b{color:var(--ink)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

/* ---------- panorama (signature) ---------- */
.pano{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 20px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.pano::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;opacity:.4;pointer-events:none}
.scen{display:flex;gap:7px;flex-wrap:wrap;position:relative;margin-bottom:14px}
.scen button{border:1px solid var(--line);background:var(--card2);color:var(--ink2);border-radius:999px;
  padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.scen button:hover{border-color:var(--net);color:var(--ink)}
.scen button.on{background:var(--net);border-color:var(--net);color:#fff;font-weight:600}
.layer{position:relative;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:start;
  padding:11px 0;border-top:1px dashed var(--line)}
.layer:first-of-type{border-top:0}
.layer-h{font-size:12px;color:var(--ink3);font-family:"IBM Plex Mono",monospace;letter-spacing:.06em;padding-top:6px}
.layer-h b{display:block;color:var(--ink2);font-family:inherit;font-size:12.5px;letter-spacing:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink2);border-radius:8px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap;font-weight:500}
.chip:hover{border-color:var(--ink3);color:var(--ink);transform:translateY(-1px)}
.chip.ai{border-style:dashed}
.chip.lit{background:var(--net);border-color:var(--net);color:#fff;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--net) 22%,transparent)}
.chip.lit.ai{background:var(--ai);border-color:var(--ai);box-shadow:0 0 0 4px color-mix(in srgb,var(--ai) 22%,transparent)}
.chip.dim{opacity:.3}
.pano-cap{position:relative;font-size:12.5px;color:var(--ink2);margin-top:12px;min-height:2.6em;
  border-left:2px solid var(--net);padding-left:10px}

/* ---------- catalog ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
  padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.mod{margin:26px 0}
.mod-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.mod-head b{font-size:17px;letter-spacing:-.01em}
.mod-head em{font-style:normal;font-size:11px;font-family:"IBM Plex Mono",monospace;color:var(--ink3);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.mod-sub{color:var(--ink2);font-size:13px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;
  transition:.18s;position:relative;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{transform:translateY(-2px);border-color:var(--net)}
.card.genai{border-left:3px solid var(--ai)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card b{font-size:14px;letter-spacing:-.01em;line-height:1.35}
.stars{font-size:10px;letter-spacing:1px;color:var(--star);white-space:nowrap;padding-top:3px}
.card p{margin:5px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.tagline{color:var(--net);font-weight:600}
.card.genai .tagline{color:var(--ai)}
.flag{display:inline-block;font-size:10px;font-family:"IBM Plex Mono",monospace;border:1px solid var(--warn);
  color:var(--warn);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,15,26,.42);opacity:0;pointer-events:none;transition:.25s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--card);
  border-left:1px solid var(--line);z-index:90;transform:translateX(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-h b{font-size:18px;letter-spacing:-.015em;line-height:1.3;display:block}
.drawer-b{padding:16px 18px 40px;overflow:auto}
.drawer-b h5{margin:16px 0 5px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  font-family:"IBM Plex Mono",monospace;font-weight:600}
.drawer-b h5:first-child{margin-top:0}
.drawer-b p{margin:0 0 6px;font-size:13.5px;color:var(--ink2)}
.case{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel button{border:1px solid var(--line);background:var(--card2);color:var(--net);border-radius:7px;
  padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.rel button:hover{background:var(--net-soft)}

/* ---------- flows ---------- */
.flow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.flow > b{font-size:15.5px;letter-spacing:-.01em}
.flow .why{color:var(--ink2);font-size:13px;margin:4px 0 12px}
.lane-t{font-size:11px;font-family:"IBM Plex Mono",monospace;color:var(--ink3);letter-spacing:.08em;
  text-transform:uppercase;margin:12px 0 6px}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.node{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 11px;cursor:pointer;
  font-size:12.5px;max-width:220px;transition:.18s;text-align:left;font-family:inherit;color:var(--ink)}
.node:hover{border-color:var(--net);background:var(--net-soft)}
.node.on{border-color:var(--net);background:var(--net-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--net) 16%,transparent)}
.node small{display:block;color:var(--ink3);font-size:10.5px;font-family:"IBM Plex Mono",monospace;margin-bottom:1px}
.arrow{display:grid;place-items:center;padding:0 7px;color:var(--ink3);font-size:14px;flex-shrink:0}
.flow-cap{margin-top:11px;font-size:13px;color:var(--ink2);border-left:2px solid var(--net);padding-left:10px;min-height:2.4em}

/* ---------- decisions ---------- */
.tree{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.tree > b{font-size:15.5px}
.tree .q{font-size:13px;color:var(--ink2);margin:4px 0 12px}
.branch{display:grid;grid-template-columns:minmax(0,1.05fr) auto minmax(0,1fr);gap:10px;align-items:center;
  padding:9px 0;border-top:1px dashed var(--line)}
.branch:first-of-type{border-top:0}
.cond{font-size:13px}
.res{font-weight:600;font-size:13.5px;color:var(--net)}
.res.ai{color:var(--ai)}
.branch .arrow{color:var(--ink3)}
.why-s{grid-column:1/-1;font-size:12px;color:var(--ink3);padding-left:2px}

/* ---------- structural breakdown diagrams ---------- */
.xtree{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px 26px;
  box-shadow:var(--shadow);margin-bottom:14px;overflow-x:auto}
.xtree>b{font-size:15.5px;letter-spacing:-.01em}
.xtree .why{color:var(--ink2);font-size:13px;margin:4px 0 20px}
.xwrap{width:max-content;min-width:100%;margin:0 auto}
.xn-root{display:flex;justify-content:center}
.xn-card{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 14px;
  text-align:center;cursor:pointer;font:inherit;color:inherit;transition:.15s;max-width:230px}
.xn-card:hover{border-color:var(--net);background:var(--net-soft)}
.xn-card.ai:hover{border-color:var(--ai);background:var(--ai-soft)}
.xn-card b{display:block;font-size:13px;font-family:"IBM Plex Mono",monospace;letter-spacing:-.01em}
.xn-card small{display:block;color:var(--ink3);font-size:11px;margin-top:3px;line-height:1.4;font-family:"IBM Plex Sans","Noto Sans SC",sans-serif}
.xn-stem{width:1px;height:16px;background:var(--line);margin:0 auto}
.xn-row{display:flex;justify-content:center;width:max-content;margin:0 auto;border-top:1px solid var(--line);position:relative}
.xn-branch{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 10px 0;position:relative;min-width:150px}
.xn-branch::before{content:"";position:absolute;top:-1px;left:50%;width:1px;height:16px;background:var(--line)}
.xn-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px;margin:0 auto}
.xn-grid .xn-card{max-width:150px;flex:1 1 130px}
.xn-tail{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;margin-top:22px;
  padding-top:18px;border-top:1px dashed var(--line)}

/* ---------- unit page: diagrams, nav ---------- */
.diagram-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.diagram-tag{display:flex;gap:8px;align-items:center;padding:12px 14px 0}
.diagram-tag em{font-style:normal;font-size:10px;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ai);border:1px solid var(--ai);background:var(--ai-soft);border-radius:5px;padding:1px 6px}
.diagram-canvas-real{margin:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:10px;overflow-x:auto}
.diagram-canvas-real svg{display:block;margin:0 auto;min-width:480px}
.diagram-body{padding:2px 14px 16px}
.diagram-body b{font-size:14.5px;display:block;margin-bottom:4px}
.diagram-body p{font-size:13px;color:var(--ink2);margin:0}
.unit-nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.unit-nav button{flex:1;display:block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;
  text-align:left;font:inherit;color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.unit-nav button.next{text-align:right}
.unit-nav button:hover{border-color:var(--net)}
.unit-nav button span{display:block;font-size:10.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace;text-transform:uppercase;margin-bottom:3px}
.unit-nav button b{font-size:14px}
.link-note{display:flex;align-items:center;gap:8px;border:1px solid var(--warn);background:var(--warn-soft);
  color:var(--warn);border-radius:999px;padding:6px 14px;font-size:12.5px;width:fit-content;margin:0 0 16px;flex-wrap:wrap}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--card2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap}
tbody th{font-weight:600;color:var(--ink);white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
td{color:var(--ink2)}
.cmp{margin-bottom:8px}
.cmp-t{font-size:15.5px;font-weight:600;margin:22px 0 4px}
.cmp-d{font-size:13px;color:var(--ink2);margin-bottom:9px}
.tip{margin-top:9px;font-size:13px;color:var(--ink2);border-left:2px solid var(--ai);padding-left:10px}

/* ---------- quiz ---------- */
.quiz-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.score{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px}
.q-card .qn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);letter-spacing:.1em}
.q-card .qt{font-size:14.5px;font-weight:600;margin:4px 0 11px;line-height:1.5}
.opts{display:grid;gap:7px}
.opt{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:8px 12px;text-align:left;
  font:inherit;font-size:13px;color:var(--ink);cursor:pointer;transition:.15s;display:flex;gap:9px}
.opt:hover:not([disabled]){border-color:var(--net)}
.opt span{font-family:"IBM Plex Mono",monospace;color:var(--ink3);font-size:12px;padding-top:1px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card2))}
.opt.wrong{border-color:#C0392B;background:color-mix(in srgb,#C0392B 10%,var(--card2))}
.exp{margin-top:10px;font-size:13px;color:var(--ink2);border-left:2px solid var(--ok);padding-left:10px;display:none}
.exp.on{display:block}

.foot{max-width:1400px;margin:0 auto;padding:0 20px 40px;color:var(--ink3);font-size:12px}
.hide{display:none!important}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;padding:16px 14px 70px}
  .rail{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;
    border-bottom:1px solid var(--line);margin-bottom:6px}
  .rail h4{display:none}
  .rail a{border-left:0;border:1px solid var(--line);white-space:nowrap;background:var(--card)}
  .rail a i{display:none}
  .layer{grid-template-columns:1fr;gap:6px}
  .layer-h{padding-top:0}
  .search input{width:150px}
  h1{font-size:25px}
  .drawer{width:100%}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand">
      <b data-i18n="brand">AWS 阶段一复习台</b>
      <span id="brandSub">AIP-C01 · 14 个知识单元</span>
    </div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索服务 / search">
    </div>
    <div class="seg" role="group" aria-label="language">
      <button id="zhBtn" aria-pressed="false">中文</button>
      <button id="enBtn" aria-pressed="true">EN</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
  </div>
</div>

<div class="shell">

{h:{zh:'① 公有/私有子网与数据流',en:'① Public vs private subnets and data flow'},items:[
{zh:'"公有/私有"的本质是**路由表里有没有到 IGW 的 0.0.0.0/0 路由**，不是子网自带的属性——删掉这条路由，子网瞬间变私有。',en:'Public vs private comes down to **whether the route table has a 0.0.0.0/0 route to the IGW** — not an inherent subnet property. Delete that route and the subnet is instantly private.'},
{zh:'公有子网出网：IGW 做 **1:1 静态 NAT**，把私有 IP 换成绑定的公网/弹性 IP。',en:'Public subnet egress: the IGW performs **1:1 static NAT**, swapping the private IP for the attached public/Elastic IP.'},
{zh:'私有子网出网：靠 **NAT 网关做 PAT（多对一）转换**，而 NAT 网关自己必须部署在公有子网里（它也要靠公有子网的路由才能上网）。',en:'Private subnet egress: a **NAT Gateway doing PAT (many-to-one)** — and the NAT Gateway itself must sit in a public subnet, because it needs that route to reach the internet.'},
{zh:'CIDR：/24 理论 256 个地址，AWS 保留 5 个（网络地址、路由器、DNS、AWS 保留、广播），实际可用 251。',en:'CIDR: a /24 has 256 addresses in theory; AWS reserves 5 (network, router, DNS, AWS-reserved, broadcast), leaving 251 usable.'}]},
{h:{zh:'② 安全组、NACL 与路由选路',en:'② Security Groups, NACLs and route selection'},items:[
{zh:'安全组（实例层）**有状态**——回程流量自动放行，不用配出站规则。',en:'Security Groups (instance level) are **stateful** — return traffic is allowed automatically, so no outbound rule is needed.'},
{zh:'NACL（子网层）**无状态**——进出各配一遍，是最容易漏配导致"单向不通"的坑。',en:'NACLs (subnet level) are **stateless** — inbound and outbound each need rules; the classic cause of one-way-broken connectivity.'},
{zh:'安全组**只有允许规则**，拉黑一个 IP 必须去 NACL 配**编号较小**的拒绝规则（按编号从小到大评估，第一条匹配生效）。注意"有状态"和"只有允许规则"是两条独立性质，别捆在一起记。',en:'Security Groups **only have allow rules**; to block an IP you need a **lower-numbered** deny rule in the NACL (evaluated ascending, first match wins). Note that "stateful" and "allow-only" are two separate properties — do not bundle them.'},
{zh:'路由表靠**最长前缀匹配**选路——范围越精确优先级越高，跟规则书写顺序无关。',en:'Route tables select by **longest prefix match** — the more specific range wins, regardless of the order rules are written.'}]},
{h:{zh:'③ VPC Endpoint 与 PrivateLink',en:'③ VPC Endpoints and PrivateLink'},items:[
{zh:'默认调 S3、Bedrock 这类 AWS 自家服务**也要走公网**（它们对外暴露公网地址），得绕经 NAT 网关 + IGW。',en:'By default even AWS-native services like S3 and Bedrock are reached **over the public internet** (they expose public endpoints), routing via NAT Gateway + IGW.'},
{zh:'**Gateway 型**：只服务 S3 和 DynamoDB，本质是路由表多一条规则，不占实体资源，**免费**。',en:'**Gateway type**: S3 and DynamoDB only, essentially one extra route-table entry, no physical resource, and **free**.'},
{zh:'**Interface 型（PrivateLink）**：支持绝大多数服务含 Bedrock，会在子网里创建**真实 ENI**，按小时 + 流量收费。',en:'**Interface type (PrivateLink)**: supports most services including Bedrock, creates a **real ENI** in your subnet, billed hourly plus per-GB.'},
{zh:'PrivateLink 只开放一个具体服务（对方看不到你 VPC 里其他东西）；VPC Peering 是把两个 VPC 整个网段打通——定位不同。',en:'PrivateLink exposes exactly one service (the other side sees nothing else in your VPC); VPC Peering joins two entire address spaces. Different jobs.'}]}]}
},

id:'m2', num:'02', t:{zh:'安全性、身份与合规性',en:'Security, Identity & Compliance'}, count:19,
sub:{zh:'19 项服务分四类：身份（IAM/角色/Cognito）、数据保护（KMS/Secrets/Macie）、威胁检测（GuardDuty/Inspector/Detective）、合规与治理（Artifact/Audit Manager/Security Hub）。',en:'Nineteen services in four families: identity (IAM, roles, Cognito), data protection (KMS, Secrets Manager, Macie), threat detection (GuardDuty, Inspector, Detective), and compliance/governance (Artifact, Audit Manager, Security Hub).'},

{n:'AWS KMS',s:3,t:{zh:'密钥管理服务',en:'Key management service'},
 d:{zh:'创建和管理加密密钥，几乎所有 AWS 服务的静态加密（S3、EBS、RDS）背后都靠它。采用信封加密：主密钥加密数据密钥，数据密钥再加密实际数据；主密钥可以是 AWS 托管的，也可以是你自己的客户管理密钥（策略控制权更大）。',en:'Creates and manages the keys behind nearly every AWS at-rest encryption feature (S3, EBS, RDS). It uses envelope encryption — a root key encrypts a data key, the data key encrypts the data — and the root key can be AWS-managed or a customer-managed key with far more policy control.'},
 c:{zh:'要求 S3 里客户数据必须加密且能控制谁可解密，于是建一个客户管理密钥并精细配置密钥策略。',en:'Customer data in S3 must be encrypted with controlled decrypt access, so the team creates a customer-managed key with a tight key policy.'}},
{n:'AWS Secrets Manager',s:3,t:{zh:'凭证存储与自动轮换',en:'Secret storage with automatic rotation'},

 c:{zh:'RDS 密码每 90 天自动轮换，Secrets Manager 同步改掉数据库端配置，应用每次连接前实时取最新密码。',en:'An RDS password rotates every 90 days; Secrets Manager updates the database too, and the app pulls the current value before each connection.'}},
{n:'AWS WAF',s:3,t:{zh:'Web 应用防火墙',en:'Web application firewall'},
 d:{zh:'按规则过滤进入 Web 应用或 API 的 HTTP/HTTPS 流量——拦 SQL 注入、XSS、限制单 IP 速率，通常挂在 CloudFront、ALB 或 API Gateway 前面。',en:'Filters HTTP/HTTPS traffic into your app or API by rule — SQL injection, XSS, per-IP rate limits — deployed in front of CloudFront, ALB or API Gateway.'},
 c:{zh:'某 API 遭遇暴力破解，在 API Gateway 前配一条 WAF 速率限制规则，超阈值自动拦截。',en:'An API under brute-force attack gets a WAF rate-based rule in front of API Gateway that blocks IPs over the threshold.'}},
{n:'AWS Shield',s:3,t:{zh:'DDoS 防护',en:'DDoS protection'},
 d:{zh:'Standard 版免费、自动为所有客户提供基础防护；Advanced 版收费，提供更强检测、实时攻击可视化和专门的响应团队。',en:'Standard is free and automatically protects every AWS customer; Advanced is paid and adds stronger detection, live attack visibility and a dedicated response team.'},
 c:{zh:'电商大促期间遭遇大规模 DDoS，Shield Advanced 自动识别并缓解，网站没出现明显中断。',en:'An e-commerce site under a large DDoS during a sale stayed up because Shield Advanced detected and absorbed the attack.'}},
{n:'Amazon GuardDuty',s:3,t:{zh:'智能威胁检测',en:'Intelligent threat detection'},

 c:{zh:'某 EC2 突然和已知恶意 IP 大量通信，GuardDuty 判断可能被攻破并生成高危告警。',en:'An EC2 instance starts talking to a known-malicious IP; GuardDuty flags a likely compromise as a high-severity finding.'}},
{n:'Amazon Inspector',s:3,t:{zh:'自动化漏洞扫描',en:'Automated vulnerability scanning'},
 d:{zh:'自动扫描 EC2 实例和容器镜像的已知 CVE、意外网络暴露面，持续运行并在发现新高危时主动告警。',en:'Automatically scans EC2 instances and container images for known CVEs and unintended network exposure, running continuously and alerting on new critical findings.'},
 c:{zh:'接进 CI/CD，每次构建镜像自动扫一遍，发现高危漏洞就阻止部署到生产。',en:'Wired into CI/CD, it scans each new image and blocks deployment when a critical CVE appears.'}},
{n:'AWS IAM Identity Center',s:2,t:{zh:'企业级单点登录（原 AWS SSO）',en:'Enterprise single sign-on (formerly AWS SSO)'},
 d:{zh:'员工用同一套身份登录多个 AWS 账号，也能扩展到第三方 SaaS，可对接企业已有的身份提供商（如 Entra ID / Azure AD），把权限管理收敛到一处。',en:'One identity for many AWS accounts (and third-party SaaS), able to federate an existing corporate IdP such as Entra ID, consolidating access management in one place.'},
 c:{zh:'10 条业务线 10 个账号，过去要记 10 套凭证，上线后登录一次就能看到全部有权限的账号。',en:'Ten business lines, ten accounts: instead of ten sets of credentials, staff sign in once and see every account they are entitled to.'}},
{n:'Amazon Macie',s:1,t:{zh:'S3 敏感数据自动发现',en:'Sensitive data discovery for S3'},

 c:{zh:'公司不确定 S3 里存了多少敏感数据、有没有误设公开，跑一遍 Macie 发现并修复几个公开桶。',en:'Unsure what sensitive data sits in S3 or which buckets are public, a team runs Macie and closes several exposed buckets.'}},

{n:'AWS Firewall Manager',s:1,t:{zh:'多账号安全策略集中下发',en:'Central security policy across accounts'},
 d:{zh:'在一个地方集中配置 WAF 规则、安全组规则、Shield 策略，自动应用到组织下所有账号和资源，避免各团队各自为政。',en:'Configure WAF rules, security-group rules and Shield policies once and push them to every account and resource in the organization, so teams cannot drift apart.'},
 c:{zh:'上百个账号的大企业，安全团队统一下发一套 WAF 基础规则，新建资源自动套用。',en:'A security team pushes one baseline WAF rule set to a hundred accounts; new resources inherit it automatically.'}},
{n:'AWS Security Hub',s:1,t:{zh:'安全态势统一仪表盘',en:'One dashboard for security posture'},
 d:{zh:'把 GuardDuty、Inspector、Macie 等的检测结果汇总到一个仪表盘，对照 CIS 等基准给出整体评分和待处理清单。',en:'Aggregates findings from GuardDuty, Inspector, Macie and others into one dashboard, scored against benchmarks such as CIS with a prioritized worklist.'},
 c:{zh:'安全团队每天早上只看 Security Hub，一眼看到昨晚所有高危项，不用切好几个控制台。',en:'The team opens one console each morning and sees every overnight critical finding instead of checking several.'}},
{n:'Amazon Detective',s:1,t:{zh:'安全事件根因分析',en:'Root-cause analysis for security events'},
 d:{zh:'自动汇总 VPC Flow Logs、CloudTrail、GuardDuty 等数据构建可视化关系图谱，帮你在事件发生后快速梳理"怎么发生的、影响了什么"。',en:'Pulls VPC Flow Logs, CloudTrail and GuardDuty data into a visual graph so you can reconstruct how an incident happened and what it touched.'},
 c:{zh:'GuardDuty 报了异常登录后，安全团队顺着 Detective 的图谱查清它之后碰过哪些资源。',en:'After a GuardDuty anomalous-login finding, the team follows the Detective graph to see everything that identity touched next.'}},
{n:'AWS Artifact',s:1,t:{zh:'合规文件自助下载门户',en:'Self-service compliance document portal'},
 d:{zh:'按需下载 AWS 的合规报告和协议，如 SOC 1/2/3、PCI DSS、各类国际与行业认证文件，用于证明"AWS 基础设施本身是合规的"。',en:'On-demand download of AWS compliance reports and agreements — SOC 1/2/3, PCI DSS, international and industry certifications — evidence that the AWS infrastructure itself is compliant.'},
 c:{zh:'金融 SaaS 给客户做安全审计，直接下载 SOC 2 报告附进审计材料。',en:'A fintech SaaS attaches the SOC 2 report straight from Artifact to a customer audit pack.'}},
{n:'AWS Audit Manager',s:0,t:{zh:'自动化合规证据收集',en:'Automated compliance evidence collection'},
 d:{zh:'持续自动收集环境里的配置与活动证据，对照 GDPR、HIPAA、PCI-DSS 等框架自动生成评估报告，省掉人工截图整理。',en:'Continuously collects configuration and activity evidence and maps it to frameworks such as GDPR, HIPAA and PCI-DSS, generating assessment reports without manual screenshotting.'},
 c:{zh:'医疗科技公司定期做 HIPAA 审计，审计季直接导出现成的证据报告。',en:'A health-tech firm exports a ready-made evidence report each HIPAA audit cycle.'}},
{n:'AWS CloudHSM',s:0,t:{zh:'专属硬件级密钥管理',en:'Dedicated hardware key management'},
 d:{zh:'提供符合 FIPS 140-2 等标准的专用硬件安全模块，在硬件层面生成和存储密钥，比 KMS 的多租户托管有更高隔离级别，成本和复杂度也更高。',en:'A dedicated FIPS 140-2 hardware security module where keys are generated and held in hardware — stronger isolation than multi-tenant KMS, at higher cost and complexity.'},
 c:{zh:'银行因监管要求密钥必须在专用硬件里，选 CloudHSM 而不是 KMS。',en:'A bank whose regulator demands hardware-resident keys chooses CloudHSM over KMS.'}},
{n:'AWS Directory Service',s:0,t:{zh:'托管的目录服务（AD）',en:'Managed directory service (AD)'},
 d:{zh:'提供托管版微软 Active Directory 或轻量 AD 兼容目录，让企业已有目录体系直接延伸到 AWS，不用为云上资源另建一套身份系统。',en:'Managed Microsoft Active Directory (or a lightweight AD-compatible directory) that extends an existing corporate directory into AWS instead of building a separate cloud identity system.'},
 c:{zh:'企业上云后员工用同一套 AD 账号，既能登本地系统也能访问 AWS 资源。',en:'After migrating, staff use the same AD account for on-prem systems and AWS resources.'}},
{n:'AWS Resource Access Manager (RAM)',s:0,t:{zh:'跨账号资源共享',en:'Cross-account resource sharing'},
 d:{zh:'把子网、Transit Gateway、许可证等资源安全共享给组织内其他账号，不用在每个账号重复创建一份。',en:'Share subnets, Transit Gateways, licences and more with other accounts in the organization instead of recreating them everywhere.'},
 c:{zh:'网络账号建好 Transit Gateway，通过 RAM 共享给十几个业务账号直接接入。',en:'A networking account builds one Transit Gateway and shares it with a dozen workload accounts through RAM.'}}
],
deep:{t:{zh:'深化：IAM 策略评估、角色与 STS、Cognito（Day 4–6）',en:'Deep dive: IAM evaluation, roles & STS, Cognito (Day 4–6)'},
groups:[
{h:{zh:'① IAM 策略评估逻辑（Day 4）',en:'① How IAM evaluates a request (Day 4)'},items:[
{zh:'五类策略共同决定"有效权限"：身份策略、资源策略、SCP、权限边界、会话策略。',en:'Five policy types decide effective permissions: identity policies, resource policies, SCPs, permissions boundaries and session policies.'},
{zh:'身份策略贴在"人/角色"身上（我能干什么），资源策略贴在"资源"身上（谁能碰我），按**身份维度**判断而不是按 IP——这也是为什么 EC2 没有资源策略这种东西。',en:'Identity policies attach to a principal (what I may do); resource policies attach to a resource (who may touch me). The axis is **identity**, not IP — which is exactly why EC2 has no resource policy.'},
{zh:'SCP 和权限边界**只做减法**，跟身份策略取交集，只会让权限变少，永远不会凭空多给。',en:'SCPs and permissions boundaries only **subtract**: they intersect with identity policies and can only shrink permissions, never grant.'},
{zh:'**显式 Deny 一票否决**：任何一处明确拒绝，别处再多允许也不行。',en:'**An explicit Deny always wins**: one explicit denial beats any number of allows elsewhere.'},
{zh:'显式拒绝 vs 隐式拒绝：前者白纸黑字写了"不行"，后者是压根没被任何策略覆盖到——效果一样，但排查方向完全相反。',en:'Explicit vs implicit deny: one is written down, the other is simply never allowed anywhere. Same outcome, opposite debugging direction.'},
{zh:'跨账号访问 S3 为什么两边都要配：同账号只靠身份策略一头就够；跨账号必须身份策略和资源策略两边同时点头。',en:'Why cross-account S3 needs both sides: within one account the identity policy alone suffices; across accounts both the identity policy and the bucket policy must say yes.'}]},
{h:{zh:'② 角色、STS 与凭证（Day 5）',en:'② Roles, STS and credentials (Day 5)'},items:[
{zh:'IAM User 是长期身份，IAM Role 是可临时借用的身份模板，STS 负责发放临时凭证。',en:'An IAM user is a long-lived identity; an IAM role is a borrowable identity template; STS issues the temporary credentials.'},
{zh:'角色贴两张纸：**信任策略**（谁能借）+ **权限策略**（借完能干啥）。',en:'A role carries two documents: a **trust policy** (who may assume it) and a **permissions policy** (what it can then do).'},
{zh:'AssumeRole 流程：发起请求 → STS 查信任策略 → 通过则签发临时三件套（15 分钟–12 小时）→ 以角色身份干活 → 到期作废。',en:'AssumeRole: request → STS checks the trust policy → issues a temporary triple (15 min–12 h) → you act as the role → the credentials expire.'},
{zh:'**ExternalId**：跨账号场景（如 SaaS 服务商代表多客户操作）防止角色 ARN 被张冠李戴的混淆代理攻击。',en:'**ExternalId** guards cross-account setups (a SaaS acting for many customers) against the confused-deputy problem.'},
{zh:'**EC2** 靠实例配置文件 + IMDS，SDK 按需缓存、快过期自动刷新——凭证是"问出来的"；**Lambda** 靠执行角色，服务执行前代为 AssumeRole 并注入环境变量——凭证是"塞进去的"。',en:'**EC2** uses an instance profile + IMDS: the SDK fetches and refreshes on demand — credentials are *pulled*. **Lambda** uses an execution role: the service assumes it for you and injects env vars — credentials are *pushed*.'},
{zh:'生产环境不用长期 Access Key：泄露风险窗口从"几个月没发现"压缩到"最多几小时自动失效"，而且每次 AssumeRole 都留 CloudTrail 审计。',en:'No long-lived access keys in production: the exposure window shrinks from months of silence to hours of automatic expiry, and every AssumeRole leaves a CloudTrail record.'}]},
{h:{zh:'③ Cognito 认证与授权（Day 6）',en:'③ Cognito authentication and authorization (Day 6)'},items:[
{zh:'**User Pool** 管认证（你是谁），认证通过发 JWT；**Identity Pool** 管换证（你能拿到什么 AWS 权限），拿 JWT 去 STS 换临时凭证，本质是 `AssumeRoleWithWebIdentity`，和 Day 5 同一套底层机制。',en:'**User Pool** handles authentication (who you are) and issues JWTs. **Identity Pool** exchanges that JWT at STS for AWS credentials — literally `AssumeRoleWithWebIdentity`, the same machinery as Day 5.'},
{zh:'只需纯认证，User Pool 就够；只有前端要直接摸 AWS 资源（浏览器直传 S3、直调 Bedrock）才需要 Identity Pool。',en:'Plain sign-in needs only a User Pool; an Identity Pool is required only when the browser touches AWS directly (uploading to S3, calling Bedrock).'},
{zh:'JWT 三件套：**ID Token**（用户属性，证明你是谁）、**Access Token**（权限范围，给 API 判断放不放行）、**Refresh Token**（换新令牌不用重新登录）。',en:'Three tokens: **ID token** (user attributes), **access token** (scope for the API to check), **refresh token** (renew without signing in again).'},
{zh:'API Gateway 三种授权：**Cognito Authorizer**（标准场景最省心）、**Lambda Authorizer**（自定义身份系统或复杂逻辑）、**IAM 授权**（调用方本身就是 AWS 身份）。',en:'Three API Gateway authorizers: **Cognito** (standard, least work), **Lambda** (custom identity systems or complex logic), **IAM** (the caller is already an AWS principal).'},
{zh:'关键认知：用户身份通常在到达后端那一刻就"下车"——Lambda 调 Bedrock 用的是**自己的执行角色**，不是用户身份；要做按用户审计得手动解析 JWT 并自己记录。',en:'Key insight: the end-user identity usually stops at the backend door — Lambda calls Bedrock with **its own execution role**, not the user’s. Per-user auditing means parsing the JWT and logging it yourself.'},
{zh:'社交登录的本质是把第三方接成 User Pool 的联合身份提供商，最终收敛成统一格式的 JWT。',en:'Social login is just federating a third-party IdP into the User Pool so everything converges on one JWT format.'}]}]}
}]};

sub:{zh:'Day 8–13：Lambda 与计算选型、流量入口与流式、S3 机制、关系型/向量/NoSQL 与缓存',en:'Day 8–13: Lambda and compute selection, entry points and streaming, S3 mechanics, relational/vector/NoSQL and caching'},

sub:{zh:'从"什么都自己管"（EC2）到"什么都不用管"（Lambda）的连续光谱，选型不是选谁更好，而是选谁的约束你能接受。',en:'A spectrum from "manage everything" (EC2) to "manage nothing" (Lambda). Choosing is not about which is better but whose constraints you can live with.'},
services:[
{n:'AWS Lambda',s:3,t:{zh:'无服务器函数计算',en:'Serverless functions'},
 d:{zh:'事件驱动、按调用计费、零请求零花费，不用管任何服务器。代价是 15 分钟硬上限、冷启动，以及"来一次跑一次"的无状态模型。是 Day 8 的深挖重点。',en:'Event-driven, billed per invocation, zero cost at zero traffic, no servers to manage. The price: a hard 15-minute ceiling, cold starts, and a stateless run-once model. The Day 8 deep dive.'},
 c:{zh:'S3 上传一份 PDF 就触发一个 Lambda 去解析、调 Bedrock 生成摘要，处理完就退出。',en:'A PDF landing in S3 triggers a Lambda that parses it, calls Bedrock for a summary, and exits.'}},
{n:'Amazon EC2',s:3,t:{zh:'云中的虚拟服务器',en:'Virtual servers in the cloud'},
 d:{zh:'租用虚拟机，自选实例类型（计算/存储/内存优化）、自装系统和软件，对配置有完全控制权，按使用时长付费。需要操作系统级控制权或 GPU 时它是唯一选择。',en:'Rent virtual machines: pick the instance family (compute/storage/memory optimized), install whatever OS and software you like, keep full control, pay for the time you use. The only option when you need OS-level control or a GPU.'},
 c:{zh:'初创公司用 EC2 跑前端和数据库，另外临时拉一批实例做批量数据分析，跑完就停。',en:'A startup hosts its front end and database on EC2, and spins up extra instances for a one-off batch analysis before shutting them down.'}},
{n:'AWS Auto Scaling',s:3,t:{zh:'自动增减资源数量',en:'Automatically add and remove capacity'},
 d:{zh:'按策略自动增减 EC2 等资源，让容量"刚好够用"。三种方式：目标追踪（盯住一个指标自动调）、步进扩缩（按阈值分级）、计划扩缩（按时间提前排好）。',en:'Adds and removes capacity by policy so you are always "just enough". Three modes: target tracking (hold a metric), step scaling (tiered thresholds) and scheduled scaling (planned in advance).'},
 c:{zh:'电商盯住 CPU 使用率做目标追踪，大促自动多开几十台，结束后自动缩回去。',en:'A retailer target-tracks CPU: dozens of instances appear for the sale and disappear afterwards.'}},
{n:'AWS Elastic Beanstalk',s:3,t:{zh:'上传代码即自动部署整套环境',en:'Upload code, get a whole environment'},
 d:{zh:'上传应用代码，自动配好 EC2、负载均衡、Auto Scaling、监控，但底层资源依然可见可调，不像纯 Serverless 那样完全黑盒。',en:'Upload code and it provisions EC2, load balancing, Auto Scaling and monitoring for you — while the underlying resources stay visible and tunable, unlike a fully opaque serverless platform.'},
 c:{zh:'小团队想快速上线 Web 应用又不想手搓基础设施，传个代码包几分钟就跑起来。',en:'A small team ships a web app in minutes without hand-building infrastructure.'}},
{n:'Amazon Lightsail',s:3,t:{zh:'固定价格的简化云主机',en:'Simple fixed-price cloud servers'},
 d:{zh:'打包好的固定价套餐（计算+存储+流量），配置简单、价格可预估，定位在传统虚拟主机和完整 EC2 之间，灵活性和扩展性弱于 EC2。',en:'Bundled fixed-price plans (compute + storage + transfer) that are easy to configure and easy to forecast — sitting between traditional shared hosting and full EC2, with less flexibility.'},
 c:{zh:'自由职业者搭个人作品集网站，选个月付套餐几分钟就有一台配好的服务器。',en:'A freelancer stands up a portfolio site on a monthly plan in minutes.'}},
{n:'AWS Batch',s:2,t:{zh:'大规模批处理任务调度',en:'Managed batch job scheduling'},
 d:{zh:'你只提交任务（"处理这 1000 个文件"），它自动决定用多少台、什么类型的机器，跑完自动释放，不用手动管理这些资源的生命周期。',en:'You submit the job ("process these 1000 files") and it decides how many machines of what type to run, releasing them when done — no capacity lifecycle to manage.'},
 c:{zh:'医学影像公司每天批量分析几万张影像，提交给 Batch 自动并行处理完释放。',en:'A medical-imaging firm submits tens of thousands of scans daily and Batch parallelizes then tears down.'}},
{n:'AWS App Runner',s:2,flag:'gap',t:{zh:'容器化 Web 服务的一键托管',en:'One-step hosting for containerized web services'},

{n:'AWS Outposts',s:0,t:{zh:'把 AWS 机架搬进你的机房',en:'AWS racks inside your own data centre'},
 d:{zh:'把 AWS 软硬件实际部署到客户机房，本地用和云上一模一样的 API 和工具，同时满足数据必须留在本地的合规要求。',en:'Physically places AWS hardware and software in your data centre so you use identical APIs and tooling locally while data stays on premises for compliance.'},

{n:'AWS Wavelength',s:0,t:{zh:'部署到 5G 网络边缘',en:'Compute at the 5G network edge'},
 d:{zh:'把计算和存储放在电信运营商的 5G 边缘，让终端请求不用绕远到 AWS 区域，适合对延迟极其敏感的应用。',en:'Places compute and storage inside carrier 5G edge sites so requests never travel back to a Region — for extremely latency-sensitive workloads.'},

deep:{t:{zh:'深化：Lambda 内部机制与计算选型（Day 8–9）',en:'Deep dive: Lambda internals and choosing compute (Day 8–9)'},
groups:[
{h:{zh:'① Lambda 深度',en:'① Lambda in depth'},items:[
{zh:'冷启动 = 执行环境重建 + 运行时启动 + 函数外初始化逻辑跑一遍；CPU/内存分配、代码包大小、语言、是否挂 VPC 都会影响它的长短。',en:'A cold start = rebuilding the execution environment + starting the runtime + running your init code once. Memory/CPU size, package size, language and VPC attachment all move the number.'},
{zh:'**预置并发**：花钱让执行环境提前热身，跳过冷启动。**预留并发**：给函数划专属并发配额，不被别的函数抢。两者管的是完全不同的事，可以同时配，也可以只配一个。',en:'**Provisioned concurrency** pays to keep environments warm and skip cold starts. **Reserved concurrency** fences off a quota so other functions cannot steal it. Different jobs — use either or both.'},
{zh:'并发默认是**整个账号共享一个池子**（默认上限 1000），某个函数流量暴涨会挤占别的函数额度导致后者被节流。',en:'Concurrency is an **account-wide pool** by default (limit 1000). A traffic spike in one function throttles the others.'},
{zh:'**15 分钟硬上限**：能拆分的长任务交给 Step Functions 接力编排；拆不开（要长连接、要维持复杂状态）的换 Fargate。',en:'**The 15-minute wall**: split what you can and orchestrate it with Step Functions; what cannot be split (long connections, in-memory state) belongs on Fargate.'},
{zh:'**响应流式**让用户"感觉立刻开始回答"，目前只能通过 **Function URL** 触发——API Gateway 不支持流式转发。',en:'**Response streaming** makes the answer feel instant, but today it only works through a **Function URL** — API Gateway will not forward a stream.'},
{zh:'**Layers**（总大小 250MB，适合轻量共用依赖）vs **容器镜像部署**（上限 10GB，适合重型依赖或已有 Docker 镜像）。',en:'**Layers** (250 MB total, good for shared light dependencies) vs **container image packaging** (10 GB, for heavy dependencies or an existing Docker image).'}]},
{h:{zh:'② 计算选型（Day 9）',en:'② Choosing compute (Day 9)'},items:[
{zh:'选择光谱：事件驱动、能接受冷启动、单次有限时 → Lambda；常驻、长连接、无严格时长（尤其 Agent 框架）→ Fargate；只想快速部署容器化 Web 服务 → App Runner；要操作系统控制权或 GPU → EC2。',en:'The spectrum: event-driven, cold-start tolerant, bounded runtime → Lambda; long-lived, long connections, no time limit (Agent frameworks especially) → Fargate; just ship a container as a web service → App Runner; OS control or a GPU → EC2.'},
{zh:'**GPU 实例**：G 系列给推理（模型已训练好，拿去回答问题），P 系列给训练（从零训练或大规模微调）。调 Bedrock 这类托管模型完全不用操心 GPU，只有自部署模型才要自己选。',en:'**GPU families**: G for inference (a trained model answering questions), P for training (from scratch or large fine-tunes). Calling managed models like Bedrock means no GPU decision at all — only self-hosting does.'},
{zh:'**Graviton（ARM）**同规格通常便宜约 20%，但不是所有软件和容器镜像都原生支持 ARM，上之前要确认整条技术栈兼容。',en:'**Graviton (ARM)** is typically ~20% cheaper like-for-like, but not every library or image is ARM-native — verify the whole stack before switching.'}]},
{h:{zh:'③ 排查"AI 应用第一次总是很慢"',en:'③ Debugging "the first request is always slow"'},items:[
{zh:'查 CloudWatch Logs 的 REPORT 行有没有 **Init Duration** → 有就确认是冷启动。',en:'Check the REPORT line in CloudWatch Logs for **Init Duration** — present means it really is a cold start.'},
{zh:'若函数挂了 VPC，对比同类未挂 VPC 函数的 Init Duration → 差异明显说明是 ENI 建立开销。',en:'If the function is VPC-attached, compare Init Duration with a non-VPC equivalent — a big gap points to ENI setup cost.'},
{zh:'Init Duration 很短但整体 Duration 依然很长 → 问题在下游依赖（数据库 / Bedrock），不在 Lambda 本身。',en:'Short Init Duration but long total Duration → the bottleneck is downstream (database, Bedrock), not Lambda.'}]}]}
},
{
id:'m4', num:'04', t:{zh:'容器',en:'Containers'}, count:4,
sub:{zh:'四项全是 ★★★，CCP 层面已经讲透，本周只用"选型对比"的方式带过。',en:'All four are ★★★ and already well covered at CCP level, so this week only revisits them as a selection comparison.'},
services:[
{n:'Amazon ECS',s:3,t:{zh:'AWS 原生容器编排',en:'AWS-native container orchestration'},
 d:{zh:'管理和调度一批容器：跑在哪、怎么健康检查、怎么自动重启。AWS 自己设计的编排系统，和 ALB、CloudWatch、Fargate 集成顺滑，学习曲线比 Kubernetes 平缓。',en:'Schedules and manages a fleet of containers — where they run, how they are health-checked, how they restart. AWS’s own design, integrating smoothly with ALB, CloudWatch and Fargate, and gentler to learn than Kubernetes.'},
 c:{zh:'把应用拆成几个微服务容器，用 ECS 统一编排部署、伸缩和健康检查。',en:'An app split into microservice containers is deployed, scaled and health-checked through one ECS setup.'}},
{n:'Amazon EKS',s:3,t:{zh:'托管版 Kubernetes',en:'Managed Kubernetes'},
 d:{zh:'业界标准、跨云通用的编排技术的托管版本。比 ECS 复杂，换来更强的可移植性和开源生态，适合团队已有 K8s 经验或需要多云。',en:'A managed version of the industry-standard, cross-cloud orchestrator. More complex than ECS, but portable with a rich open-source ecosystem — right when the team already knows Kubernetes or needs multi-cloud.'},
 c:{zh:'已经在别的云上用 K8s 的公司迁到 AWS，选 EKS 让原有配置和工具链几乎直接复用。',en:'A company already running Kubernetes elsewhere migrates to EKS and reuses nearly all of its manifests and tooling.'}},
{n:'Amazon ECR',s:3,t:{zh:'托管的容器镜像仓库',en:'Managed container registry'},
 d:{zh:'存放容器镜像，和 ECS、EKS、Lambda 无缝集成，支持版本管理和漏洞扫描，不用自建镜像仓库。',en:'Stores container images with native ECS, EKS and Lambda integration, versioning and vulnerability scanning — no registry to run yourself.'},
 c:{zh:'CI/CD 每次提交自动构建镜像推到 ECR，部署时 ECS 直接从这里拉最新版本。',en:'CI/CD builds and pushes an image on every commit; ECS pulls the newest tag on deploy.'}},
{n:'AWS Fargate',s:3,t:{zh:'无服务器容器运行环境',en:'Serverless container runtime'},
 d:{zh:'"无服务器但常驻"——不用管底层 EC2 主机，但跑的是一直挂着的容器：没有 15 分钟的墙，能维持长连接，代价是容器一直跑就一直计费，不像 Lambda 零请求零花费。',en:'"Serverless but always-on": no EC2 hosts to manage, yet the container keeps running — no 15-minute wall, long connections are fine, but you pay while it runs, unlike Lambda’s zero-traffic-zero-cost.'},
 c:{zh:'Agent 框架需要长连接 + 复杂依赖 + 内存中状态，放 Fargate 而不是 Lambda。',en:'An Agent framework needing long connections, heavy dependencies and in-memory state runs on Fargate rather than Lambda.'}}
],
deep:{t:{zh:'深化：Fargate 与 ECS/EKS 选型（Day 9）',en:'Deep dive: Fargate and ECS vs EKS (Day 9)'},
groups:[{h:{zh:'判断标准',en:'Decision criteria'},items:[
{zh:'Agent 框架的运行时首选 Fargate：长连接 + 复杂依赖 + 需要维持内存中状态，这个组合天然适合常驻容器，而不是"来一次跑一次"的 Lambda。',en:'Fargate is the default runtime for Agent frameworks: long connections, heavy dependencies and in-memory state suit an always-on container, not a run-once function.'},
{zh:'ECS vs EKS 的判断标准是**要不要多云、团队有没有 Kubernetes 积累**，不是谁"更好"——没有这两条理由，ECS 通常更省心。',en:'ECS vs EKS turns on **multi-cloud need and existing Kubernetes skill**, not on which is "better". Without either reason, ECS is usually the calmer choice.'}]}]}
},
{
id:'m5', num:'05', t:{zh:'存储',en:'Storage'}, count:7,
sub:{zh:'三种形态：块（EBS，挂给一台机器）、文件（EFS/FSx，多台共享）、对象（S3，HTTP 访问的无限桶）。GenAI 场景里 S3 几乎是所有数据的起点。',en:'Three shapes: block (EBS, one machine), file (EFS/FSx, shared), object (S3, an endless bucket over HTTP). In GenAI work, S3 is where almost every dataset starts.'},
services:[
{n:'Amazon S3',s:3,t:{zh:'对象存储',en:'Object storage'},
 d:{zh:'近乎无限容量的对象存储，按 HTTP 访问，是数据湖、RAG 语料、模型产物、日志的默认落点。事件通知、预签名 URL、版本控制、生命周期、四种加密是 Day 11 的深挖点。',en:'Effectively unlimited object storage over HTTP — the default home for data lakes, RAG corpora, model artefacts and logs. Event notifications, presigned URLs, versioning, lifecycle rules and four encryption modes are the Day 11 deep dive.'},
 c:{zh:'用户上传的 PDF 全部落 S3，事件通知触发 Lambda 做解析和向量化。',en:'Every uploaded PDF lands in S3, and an event notification triggers a Lambda to parse and embed it.'}},
{n:'Amazon EBS',s:3,t:{zh:'挂载在 EC2 上的块存储',en:'Block storage for EC2'},
 d:{zh:'给 EC2 用的持久化块存储卷，像挂一块硬盘，实例停机重启数据仍在。有不同性能等级，适合低延迟高吞吐随机读写，比如数据库存储层。',en:'A persistent block volume attached to an instance like a disk; data survives stop and restart. Performance tiers suit low-latency, high-throughput random I/O such as a database layer.'},
 c:{zh:'跑 MySQL 的 EC2 把数据文件放在高性能 EBS 卷上，重启后数据完整保留。',en:'A MySQL instance keeps its data files on a high-IOPS EBS volume that survives reboots.'}},
{n:'Amazon EFS',s:3,t:{zh:'可被多台机器同时挂载的文件系统',en:'Shared elastic file system'},
 d:{zh:'基于 NFS 的共享文件系统，容量自动伸缩，最大特点是**可被多个 EC2 甚至 Lambda 同时挂载读写**——这是 EBS 做不到的。',en:'An NFS-based shared file system that grows automatically; its defining trait is that **many EC2 instances, and even Lambda, can mount it at once** — something EBS cannot do.'},
 c:{zh:'视频处理集群多台实例要读同一批源文件，挂 EFS 共享一份，不用各自复制。',en:'A video-processing fleet mounts one EFS share instead of each node copying the source files.'}},
{n:'Amazon S3 Glacier',s:3,t:{zh:'超低成本归档存储',en:'Ultra-low-cost archival storage'},
 d:{zh:'为"很少访问但必须长期保留"的数据设计，价格远低于标准 S3，代价是取回要额外时间（几分钟到几小时）和取回费用。',en:'Built for data that is rarely read but must be kept, at a fraction of standard S3 cost — in exchange for retrieval time (minutes to hours) and retrieval fees.'},
 c:{zh:'医疗机构按法规保留病历 7 年以上，存进 Deep Archive 把成本压到最低。',en:'A hospital keeps records for seven-plus years in Deep Archive at minimum cost.'}},
{n:'Amazon FSx',s:2,t:{zh:'托管的第三方文件系统',en:'Managed third-party file systems'},
 d:{zh:'提供 Windows File Server、Lustre、NetApp ONTAP 等主流文件系统的托管版本，适合本来就依赖这些技术、迁云又不想改造应用的场景。',en:'Managed versions of Windows File Server, Lustre and NetApp ONTAP for workloads already built on those file systems that should not be rewritten to move.'},
 c:{zh:'Windows 应用长期依赖 Windows File Server，上云用 FSx，应用代码不用改。',en:'A Windows application dependent on Windows File Server moves to FSx with no code changes.'}},
{n:'AWS Storage Gateway',s:2,t:{zh:'本地与云端存储的混合网关',en:'Hybrid gateway between on-prem and cloud storage'},
 d:{zh:'在本地部署一个网关，把本地应用的存储请求转成对 S3 等云存储的调用，同时在本地缓存热数据加速访问。',en:'A local gateway appliance translates on-prem storage requests into calls to S3 and friends, caching hot data locally for speed.'},
 c:{zh:'企业逐步把文件服务器迁云，本地应用访问方式不变，背后数据已在同步到 S3。',en:'A file server migrates gradually: local apps keep their access pattern while data syncs to S3 behind the scenes.'}},
{n:'AWS Backup',s:2,t:{zh:'统一的备份管理',en:'Unified backup management'},
 d:{zh:'在一个地方集中管理 EC2、EBS、RDS、DynamoDB 等多种资源的备份频率、保留时长、跨区域复制，不用为每种资源分别配一套机制。',en:'One place to define backup frequency, retention and cross-Region copies for EC2, EBS, RDS, DynamoDB and more, instead of a separate mechanism per service.'},
 c:{zh:'过去 EC2 和 RDS 各写各的备份脚本，改用 AWS Backup 后在一个控制台统一制定计划。',en:'Separate backup scripts for EC2 and RDS collapse into one console with one plan.'}}
],
deep:{t:{zh:'深化：S3 核心机制（Day 11）',en:'Deep dive: S3 core mechanics (Day 11)'},
groups:[{h:{zh:'五组要点',en:'Five points'},items:[
{zh:'**事件通知四种下游**：单一处理逻辑用 Lambda，要削峰缓冲用 SQS，一个事件多方广播用 SNS，复杂过滤/路由用 EventBridge。',en:'**Four event-notification targets**: Lambda for a single handler, SQS to buffer spikes, SNS to broadcast, EventBridge for content-based filtering and routing.'},
{zh:'**预签名 URL**：后端生成带签名、有时效、权限受限的临时链接，前端直接和 S3 对话，文件不经过后端服务器——但它本身**不含"上传完通知谁"的能力**，要配合事件通知才是完整流程。',en:'**Presigned URLs**: the backend mints a signed, time-limited, scope-limited link so the browser talks to S3 directly and the file never passes through your server. It carries **no "notify on completion" ability** — pair it with event notifications for the full flow.'},
{zh:'**加密四选一**：SSE-S3（全托管、免费）、SSE-KMS（可审计，企业合规问卷最常要求）、SSE-C（客户自管密钥）、DSSE-KMS（双重加密，顶格合规）。',en:'**Four encryption options**: SSE-S3 (managed, free), SSE-KMS (auditable, what compliance questionnaires ask for), SSE-C (you hold the key), DSSE-KMS (double encryption for the strictest regimes).'},
{zh:'**版本控制 + 生命周期规则**：删除只是打一个删除标记，历史版本还在；生命周期规则负责把旧版本自动转冷存储或彻底清理，控制成本。',en:'**Versioning + lifecycle rules**: a delete only writes a delete marker and old versions persist; lifecycle rules move or expire them to control cost.'},
{zh:'**强一致性**：2020 年 12 月起 S3 所有操作（新建/覆盖/删除）都是强一致，写完立刻读保证读到最新，不用再写防御性重试。',en:'**Strong consistency**: since December 2020 every S3 operation (put, overwrite, delete) is strongly consistent — read-after-write is guaranteed, so defensive retry logic is obsolete.'}]}]}
},
{
id:'m6', num:'06', t:{zh:'数据库',en:'Databases'}, count:5,
sub:{zh:'关系型（RDS/Aurora）、NoSQL（DynamoDB）、内存（MemoryDB/ElastiCache）、图（Neptune）。RAG 的向量库经常就藏在 Aurora 的 pgvector 扩展里。',en:'Relational (RDS/Aurora), NoSQL (DynamoDB), in-memory (MemoryDB/ElastiCache) and graph (Neptune). A RAG vector store often hides inside Aurora as the pgvector extension.'},
services:[
{n:'Amazon RDS',s:3,t:{zh:'托管的关系型数据库',en:'Managed relational database'},
 d:{zh:'托管 MySQL、PostgreSQL、SQL Server 等引擎，替你做补丁、备份、故障切换。核心概念是多可用区（高可用）和只读副本（读扩展）——这两件事常被混为一谈。',en:'Runs MySQL, PostgreSQL, SQL Server and others for you, handling patching, backups and failover. The two concepts to keep apart: Multi-AZ (availability) and read replicas (read scale-out).'},
 c:{zh:'业务系统用 RDS for PostgreSQL，开多可用区保高可用，再挂两个只读副本分流报表查询。',en:'A business system runs RDS for PostgreSQL with Multi-AZ for availability plus two read replicas to absorb reporting queries.'}},
{n:'Amazon Aurora',s:3,t:{zh:'存算分离的云原生关系型数据库',en:'Cloud-native relational database with separated storage'},
 d:{zh:'兼容 MySQL/PostgreSQL，存储层跨 3 个可用区维护 6 份副本，故障恢复和副本创建都快得多。Serverless v2 以 0.5 ACU 为颗粒度秒级伸缩、最低可到 0 ACU 自动暂停。装上 pgvector 就是最省钱的向量库。',en:'MySQL/PostgreSQL-compatible with a storage layer keeping six copies across three AZs, giving much faster recovery and replica creation. Serverless v2 scales in 0.5-ACU steps and can pause at 0 ACU. Add pgvector and it becomes the cheapest practical vector store.'},
 c:{zh:'一个 RAG 应用的元数据和向量都放在 Aurora PostgreSQL + pgvector，只维护一套数据库。',en:'A RAG app keeps both metadata and embeddings in Aurora PostgreSQL with pgvector — one database to operate.'}},
{n:'Amazon DynamoDB',s:3,t:{zh:'全托管 NoSQL 键值数据库',en:'Fully managed NoSQL key-value database'},
 d:{zh:'毫秒级、按键查询、水平扩展无上限，代价是不支持 JOIN、必须围绕访问模式设计键。分区键、单表设计、Streams、TTL 是 Day 13 的深挖点。',en:'Millisecond key-based access that scales horizontally without limit, at the cost of no JOINs and a key design driven by access patterns. Partition keys, single-table design, Streams and TTL are the Day 13 deep dive.'},
 c:{zh:'聊天应用用会话 ID 做分区键存消息记录，配 TTL 让 30 天前的记录自动清理。',en:'A chat app partitions messages by conversation ID and lets TTL expire anything older than 30 days.'}},
{n:'Amazon MemoryDB for Redis',s:3,t:{zh:'兼容 Redis 的持久化内存数据库',en:'Durable Redis-compatible in-memory database'},
 d:{zh:'和 ElastiCache 的关键区别是**持久化**：它是"丢了会出事"的主存储，不是"丢了顶多变慢"的缓存层，适合 Agent 会话状态这种不能凭空消失的数据。',en:'The key difference from ElastiCache is **durability**: it is a primary store where loss hurts, not a cache where loss only slows you down — right for Agent session state that must not vanish.'},
 c:{zh:'多轮对话 Agent 的会话上下文存 MemoryDB，节点重启也不会把用户的对话弄丢。',en:'A multi-turn Agent stores conversation context in MemoryDB so a node restart does not drop the thread.'}},
{n:'Amazon ElastiCache',s:2,t:{zh:'纯缓存层（Redis / Memcached）',en:'Pure cache layer (Redis / Memcached)'},
 d:{zh:'内存缓存，丢了顶多变慢：适合语义缓存、热点查询结果这类"重算一次就能补回来"的数据。和 MemoryDB 的分界线就是这个问题。',en:'An in-memory cache where a loss just means recomputing: semantic caches, hot query results, anything you can rebuild. That question is the entire boundary with MemoryDB.'},
 c:{zh:'把常见问题的模型回答做语义缓存放 ElastiCache，命中就省一次 Bedrock 调用。',en:'Semantic caching of frequent model answers in ElastiCache saves a Bedrock call on every hit.'}},
{n:'Amazon Neptune',s:0,t:{zh:'托管的图数据库',en:'Managed graph database'},
 d:{zh:'存储和查询由节点与关系构成的图数据，支持 Gremlin、SPARQL，适合多层关联查询——传统关系库做这类查询效率明显下降。变体 Neptune Analytics 带向量能力，适合 GraphRAG。',en:'Stores and queries node-and-edge data with Gremlin or SPARQL, suited to multi-hop relationship queries where relational JOINs degrade. The Neptune Analytics variant adds vectors for GraphRAG.'},
 c:{zh:'电商做"买了这个的人还买了什么、这些人还关注什么"的多层推荐，用图谱比多次 JOIN 快得多。',en:'An "people who bought this also follow that" multi-hop recommendation runs far faster as a graph than as repeated JOINs.'}}
],
deep:{t:{zh:'深化：关系型、向量与 DynamoDB/缓存（Day 12–13）',en:'Deep dive: relational, vector, DynamoDB and caching (Day 12–13)'},
groups:[
{h:{zh:'① 关系型数据库与向量存储（Day 12）',en:'① Relational databases and vector storage (Day 12)'},items:[
{zh:'**多可用区 vs 只读副本**：多可用区备库是"备胎"（平时不可读，故障才接管，管高可用）；只读副本是"能上路的车"（可读，专门分流读请求，管读扩展）。',en:'**Multi-AZ vs read replica**: the Multi-AZ standby is a spare tyre (unreadable in normal times, takes over on failure — availability); a read replica is a second car on the road (readable, absorbs read traffic — scale).'},
{zh:'**Aurora 存算分离**：存储层跨 3 个可用区自动维护 6 份副本，带来秒级故障恢复和更快的副本创建。',en:'**Aurora separates storage from compute**: six copies across three AZs give second-level recovery and much faster replica creation.'},
{zh:'**Aurora Serverless v2**：以 0.5 ACU 为颗粒度秒级伸缩、不中断连接，最低可配到 0 ACU 自动暂停（约 15 秒唤醒延迟）。',en:'**Aurora Serverless v2** scales in 0.5-ACU steps in seconds without dropping connections, and can idle down to 0 ACU (~15 s to wake).'},
{zh:'**pgvector 不是独立产品**，是 PostgreSQL 的扩展插件，寄生在已有的 Aurora 账单和运维经验里，是 RAG 向量库最省钱的选择。',en:'**pgvector is not a product** but a PostgreSQL extension riding on the Aurora bill and skills you already have — the cheapest serious RAG vector store.'},
{zh:'**IVFFlat vs HNSW**：前者建索引快、省内存，但精度对分簇数敏感；后者查询快、精度普遍更高，但建索引慢、占内存大——生产级通常优先 HNSW。',en:'**IVFFlat vs HNSW**: IVFFlat builds fast and uses little memory but its accuracy depends on cluster count; HNSW queries faster and more accurately but builds slowly and eats memory — production usually picks HNSW.'}]},
{h:{zh:'② DynamoDB 与缓存（Day 13）',en:'② DynamoDB and caching (Day 13)'},items:[
{zh:'**分区键与热分区**：分区键决定数据怎么打散，取值种类太少、请求集中在少数值上就会出现热分区（个别分区被挤爆、其他闲置）。',en:'**Partition keys and hot partitions**: the key decides how data spreads; too few distinct values (or skewed traffic) overloads a few partitions while the rest idle.'},
{zh:'**单表设计**：因为不支持 JOIN，把经常一起查询的不同类型数据用有规律的键塞进同一张表，一次请求就能拿到。',en:'**Single-table design**: with no JOINs, related entity types share one table under a deliberate key scheme so one request returns everything.'},
{zh:'**Streams**：数据变动的事件通知机制，和 S3 事件通知同一个思路，常触发 Lambda 做后续动作。',en:'**Streams**: change events, conceptually the same as S3 event notifications, typically triggering a Lambda.'},
{zh:'**TTL**：加一个过期时间戳，到期自动清理——不是立刻删除，是启动删除流程，有延迟。',en:'**TTL**: add an expiry timestamp and items are removed automatically — not instantly, but through a background deletion process.'},
{zh:'**ElastiCache vs MemoryDB**：问自己"这份数据丢了，是变慢还是出事？"变慢 → ElastiCache（语义缓存）；出事 → MemoryDB（Agent 会话状态）。',en:'**ElastiCache vs MemoryDB**: ask "if this is lost, is it slower or is it broken?" Slower → ElastiCache (semantic cache); broken → MemoryDB (Agent session state).'}]},
{h:{zh:'③ 流量入口与 LLM 流式（Day 10）',en:'③ Entry points and LLM streaming (Day 10)'},items:[
{zh:'REST API 功能全但贵，HTTP API 便宜快但功能少，两者都受 **29 秒硬超时**限制。',en:'REST APIs are full-featured but pricier; HTTP APIs are cheap and fast but leaner — both hit the same **29-second hard timeout**.'},
{zh:'绕开 29 秒的三条路：① 流式返回（自然不会被判定为卡住）；② 异步模式（先返回任务 ID 再轮询或推送）；③ 换一个不受限的入口（ALB）。',en:'Three ways around it: (1) stream the response, (2) go async — return a job ID and poll or push later, (3) use an entry point without the limit (ALB).'},
{zh:'三种流式落地：**轮询**（最简单，延迟感明显）、**SSE**（服务器单向推送，浏览器原生支持，AWS 上靠 Lambda Function URL + 响应流式，是 LLM 打字机效果的主流做法）、**WebSocket**（全双工，靠 API Gateway WebSocket API，适合用户要中途打断模型的场景）。',en:'Three streaming approaches: **polling** (simplest, visibly laggy), **SSE** (one-way server push, native in browsers, delivered on AWS via a Lambda Function URL with response streaming — the mainstream typewriter effect), and **WebSocket** (full duplex via API Gateway’s WebSocket API, for letting users interrupt the model mid-answer).'}]}]}
}]};

warn:{zh:'来源提醒：本周四个模块（应用程序集成、分析、管理与监管、开发工具）没有对应课程截图，服务清单与星级来自《AWS学习计划_概念补齐版》的估算，可信度比 Week 1/2 低一级。拿到截图后应回头核对。另外 CloudFormation 归属"管理与监管"，CDK 与 Terraform 才属于"开发工具"，只是同一天讲完整 IaC 主题。',en:'Source caveat: the four modules this week (Application Integration, Analytics, Management & Governance, Developer Tools) have no course screenshots. The service list and star ratings are estimated from the study-plan document, so confidence is one notch below Weeks 1–2 and should be re-verified. Also note CloudFormation belongs to Management & Governance; only CDK and Terraform are Developer Tools — they were taught together purely to cover IaC in one sitting.'},
modules:[

id:'m7', num:'07', t:{zh:'应用程序集成',en:'Application Integration'}, count:6,
sub:{zh:'把散落的组件连成系统的胶水层。四个消息服务的区别不是"谁更强"，而是消息被消费之后还在不在、能不能一对多、能不能重试。',en:'The glue that turns components into a system. The four messaging services differ not in power but in whether a message survives consumption, whether it fans out, and whether it retries.'},
services:[
{n:'Amazon SQS',s:2,t:{zh:'点对点消息队列',en:'Point-to-point message queue'},
 d:{zh:'一条消息只被一个消费者处理一次，靠可见性超时防止重复认领，处理失败会自动重新出现等人捡起（所以处理逻辑必须幂等）。标准队列高吞吐不保证顺序，FIFO 保证顺序但吞吐有限。',en:'One message, one consumer, once — a visibility timeout stops double-claiming, and a failed message reappears for someone else to pick up (so handlers must be idempotent). Standard queues are high-throughput and unordered; FIFO preserves order at lower throughput.'},
 c:{zh:'订单洪峰打进来先进 SQS 排队，后端按自己的速度慢慢消费，不会被打垮。',en:'An order spike lands in SQS first and the backend drains it at its own pace instead of collapsing.'}},
{n:'Amazon SNS',s:2,t:{zh:'一对多广播通知',en:'One-to-many broadcast'},
 d:{zh:'把一条消息推送给所有订阅者，但**没有暂存和重试能力**，推送失败基本就丢了。经典组合是 **SNS 扇出到多个 SQS**：SNS 补上 SQS 不能一对多的短板，SQS 补上 SNS 不能重试的短板。',en:'Pushes one message to every subscriber, but with **no buffering or retry** — a failed delivery is generally lost. The classic pattern is **SNS fanning out into several SQS queues**: SNS fixes SQS’s lack of fan-out, SQS fixes SNS’s lack of retry.'},
 c:{zh:'一笔订单产生后广播给库存、邮件、财务三个系统，每个系统后面挂自己的队列各自重试。',en:'A new order is broadcast to inventory, email and finance, each behind its own queue retrying independently.'}},
{n:'Amazon EventBridge',s:2,t:{zh:'带智能路由的事件总线',en:'Event bus with content-based routing'},
 d:{zh:'比 SNS 多了**按内容做条件路由、Schema Registry、定时触发、接第三方 SaaS**这几项能力，可以理解为"带智能路由的升级版 SNS"。',en:'Adds **content-based routing, a schema registry, scheduled rules and third-party SaaS sources** on top of what SNS does — effectively SNS with a routing brain.'},
 c:{zh:'同一个事件流里，只有金额大于 10000 的订单事件被路由到风控 Lambda。',en:'From one event stream, only orders above 10,000 are routed to the risk-review Lambda.'}},
{n:'AWS Step Functions',s:3,t:{zh:'可视化的确定性工作流编排',en:'Visual deterministic workflow orchestration'},
 d:{zh:'用状态机把多步流程串起来，每步的走向在设计阶段就写死。六种基本状态：Task、Choice、Wait、Succeed/Fail、Parallel、Map。是 Day 16 的深挖重点，也是"该不该用 Agent"这道题的另一半答案。',en:'A state machine stitching multi-step processes together, where every branch is decided at design time. Six basic states: Task, Choice, Wait, Succeed/Fail, Parallel, Map. The Day 16 deep dive — and the other half of the "should this be an Agent?" question.'},
 c:{zh:'文档处理流程：提取文字 → 检测 PII → 高敏感转人工审批 → 生成摘要 → 存库。',en:'A document pipeline: extract text → detect PII → route sensitive cases to human approval → summarize → store.'}},
{n:'Amazon AppFlow',s:0,t:{zh:'SaaS 之间的数据自动同步',en:'No-code data sync with SaaS apps'},
 d:{zh:'在 AWS 服务和 Salesforce、Slack、ServiceNow 这类第三方 SaaS 之间不写代码就能双向同步数据，内置转换、字段映射、过滤和定时/实时两种触发。',en:'Moves data both ways between AWS and SaaS apps such as Salesforce, Slack and ServiceNow without code, with built-in transformation, field mapping, filtering and scheduled or real-time triggers.'},
 c:{zh:'每天凌晨自动把 Salesforce 的客户数据同步到 S3 做分析，不用自己写 API 脚本。',en:'Salesforce customer data syncs to S3 nightly for analysis without a hand-written API script.'}},
{n:'AWS AppConfig',s:0,t:{zh:'应用配置的动态管理与灰度发布',en:'Dynamic configuration with safe rollout'},
 d:{zh:'把功能开关、限流阈值这类配置从代码里剥离出来集中管理，支持灰度发布和自动回滚，不用重新部署代码就能调整行为。',en:'Pulls feature flags and thresholds out of code into managed configuration with staged rollout and automatic rollback — behaviour changes without a deploy.'},
 c:{zh:'新功能先对 5% 用户开启，观察没报错再逐步推到 100%，出问题一键回滚。',en:'A new feature opens to 5% of users, widens as metrics stay clean, and rolls back in one step if not.'}}
],
deep:{t:{zh:'深化：消息四方选型与 Step Functions（Day 15–16）',en:'Deep dive: four-way messaging choice and Step Functions (Day 15–16)'},
groups:[
{h:{zh:'① 消息与事件四方选型',en:'① Choosing among the four'},items:[
{zh:'SQS 的核心机制：可见性超时防重复认领、失败自动重现（要求幂等）、标准 vs FIFO、反复失败的消息交给**死信队列（DLQ）**隔离排查。',en:'SQS essentials: visibility timeout prevents double-claiming, failures reappear automatically (hence idempotency), standard vs FIFO, and repeat failures land in a **dead-letter queue** for isolation.'},
{zh:'SNS 没有暂存重试能力，所以 **SNS → 多个 SQS** 是补短板的经典组合，不是重复建设。',en:'SNS cannot buffer or retry, which is why **SNS → several SQS queues** is a complementary pattern rather than duplication.'},
{zh:'EventBridge = SNS + 条件路由 + Schema Registry + 定时触发 + 第三方 SaaS 事件源。',en:'EventBridge = SNS + content routing + schema registry + scheduling + third-party SaaS event sources.'},
{zh:'**Kinesis 的本质区别**：数据不会因为被消费就消失，默认保留 24 小时（最长 365 天），多个消费者可以各自独立、重复读取——专门服务"同一份数据要被多方完整读取甚至回放"的场景。',en:'**What makes Kinesis different**: consumption does not delete the data. It is retained for 24 hours by default (up to 365 days) and multiple consumers read independently and can replay — built for one stream read fully by many parties.'},
{zh:'常见错误：需求同时提到"多方消费"和"流式"时提议 SNS + Kinesis——Kinesis 一个就同时满足两点，不需要叠加。',en:'A common trap: proposing SNS + Kinesis when a requirement mentions both fan-out and streaming. Kinesis alone satisfies both; the addition is redundant.'}]},
{h:{zh:'② Step Functions',en:'② Step Functions'},items:[
{zh:'**Parallel vs Map**：Parallel 是几个数量固定、逻辑不同的分支同时跑（提取文字 + 生成缩略图）；Map 是同一套逻辑套在数量不确定的数组上（50 份文档各跑一遍），数据量特大时用分布式 Map。',en:'**Parallel vs Map**: Parallel runs a fixed number of different branches at once (extract text + make thumbnail); Map applies one logic to an array of unknown length (50 documents, same pipeline), with distributed Map for very large sets.'},
{zh:'标准工作流按状态转换次数计费、精确执行一次、最长跑 1 年、支持人工审批回调；快速工作流按执行次数+时长+内存计费、至少一次执行、最长 5 分钟、吞吐更高。',en:'Standard workflows bill per state transition, run exactly once, last up to a year and support human-approval callbacks. Express workflows bill by count, duration and memory, run at-least-once, cap at five minutes and handle far higher throughput.'},
{zh:'**人工审批断点**靠 `.waitForTaskToken` 回调等待模式实现，**只有标准工作流支持**——快速工作流 5 分钟上限和"可能等几小时"天然冲突。',en:'**Human approval** uses the `.waitForTaskToken` callback pattern and is **standard-only** — a five-minute cap cannot host a wait that may run for hours.'},
{zh:'**Step Functions 还是 Agent**：流程能在设计阶段完全想清楚 → Step Functions（便宜、快、可预测）；下一步该做什么必须让模型临场判断 → Agent（贵、难预测，但能应对无法枚举的场景）。',en:'**Step Functions or Agent**: if the branches can be fully enumerated at design time → Step Functions (cheap, fast, predictable). If the next step must be decided by the model in the moment → Agent (costly, less predictable, but handles what cannot be enumerated).'}]}]}
},
{
id:'m8', num:'08', t:{zh:'分析',en:'Analytics'}, count:8,
sub:{zh:'RAG 的上游全在这里：原始数据怎么落地分层、怎么被编目和清洗、最后怎么变成能检索的向量。',en:'Everything upstream of RAG lives here: how raw data lands and gets layered, catalogued and cleaned, and finally how it becomes searchable vectors.'},
services:[
{n:'Amazon OpenSearch Service / Serverless',s:3,t:{zh:'RAG 的默认检索后端',en:'The default RAG retrieval backend'},
 d:{zh:'搜索与分析引擎，既能做 BM25 关键词检索，也能做向量近似最近邻检索，还能两者混合——这是它作为 RAG 后端最大的价值。注意 Serverless 的 **OCU 有最低计费门槛**，没流量也要付钱。',en:'A search and analytics engine that does BM25 keyword search, approximate-nearest-neighbour vector search, and hybrids of both — its main value as a RAG backend. Note that Serverless has a **minimum OCU charge** even with no traffic.'},
 c:{zh:'企业知识库把文档向量和原文都放进 OpenSearch，检索时向量 + 关键词混合打分。',en:'A knowledge base stores both embeddings and source text in OpenSearch and blends vector and keyword scores at query time.'}},
{n:'AWS Glue',s:3,t:{zh:'数据发现、编目与 ETL',en:'Data discovery, cataloguing and ETL'},
 d:{zh:'三件套：**Crawler**（认路，扫描数据推断出表结构）→ **Data Catalog**（记路，只存元数据不存数据）→ **ETL Job**（搬东西，真正处理数据）。处理完常要再跑一次 Crawler 更新目录。',en:'Three parts: a **Crawler** (scans data and infers schema), the **Data Catalog** (metadata only, never the data itself) and **ETL jobs** (the actual processing). After a job, you usually re-crawl to refresh the catalogue.'},
 c:{zh:'S3 里堆着一堆 CSV，Crawler 扫一遍生成表结构，ETL Job 转成 Parquet 分区存回去。',en:'A pile of CSVs in S3 gets crawled into a schema, then converted to partitioned Parquet by an ETL job.'}},
{n:'Amazon Athena',s:2,t:{zh:'直接对 S3 跑 SQL 的 Serverless 查询',en:'Serverless SQL straight over S3'},
 d:{zh:'不用搬数据、不用建集群，直接对 S3 里的文件跑 SQL，**按扫描量计费**。分区跳过不相关文件夹、列存跳过不相关列，两层优化是**相乘关系**，叠加起来能把账单压到千分之一。',en:'No data movement, no cluster: run SQL directly over files in S3, **billed by bytes scanned**. Partitions skip irrelevant folders and columnar storage skips irrelevant columns — the two savings **multiply**, which can cut a bill by three orders of magnitude.'},
 c:{zh:'临时想查上周某个渠道的转化数据，直接对分区好的 Parquet 跑一句 SQL。',en:'A one-off question about last week’s conversions is answered with a single SQL statement over partitioned Parquet.'}},
{n:'Kinesis 家族',disp:{zh:'Kinesis 家族',en:'The Kinesis family'},s:2,t:{zh:'有序、可回放的数据流',en:'Ordered, replayable data streams'},
 d:{zh:'严格来说属于分析模块，但常和消息队列一起对比。核心特征：数据不因消费而消失，默认保留 24 小时（最长 365 天），多个消费者独立读取、可回放。',en:'Formally part of Analytics but always compared with the messaging services. Defining trait: data is not consumed away — retained 24 hours by default (up to 365 days), read independently by many consumers, and replayable.'},
 c:{zh:'点击流同时喂给实时看板和离线数仓两条下游，各自从自己的位置读，互不影响。',en:'A clickstream feeds both a live dashboard and an offline warehouse, each reading at its own position.'}},
{n:'AWS Lake Formation',s:2,t:{zh:'数据湖的统一权限管理',en:'Unified permissions for the data lake'},
 d:{zh:'在数据湖层面做行级、列级访问控制，一次配置所有查询引擎（Athena、Redshift、EMR）都遵守，不用每个引擎各配一遍。',en:'Row- and column-level access control defined once at the lake level and honoured by every query engine (Athena, Redshift, EMR) instead of configured per engine.'},
 c:{zh:'跨国企业规定"每个地区的分析师只能查自己地区的数据"，在 Lake Formation 配一次即可。',en:'A rule that analysts see only their own region’s data is configured once in Lake Formation.'}},
{n:'Amazon Redshift',s:0,t:{zh:'云原生数据仓库',en:'Cloud data warehouse'},
 d:{zh:'列式存储 + 大规模并行处理，为海量结构化数据的复杂聚合分析优化。和 Athena 的分界线：Athena 适合临时查 S3，Redshift 适合"数据已整理好、需要长期反复做复杂分析"。',en:'Columnar storage with massively parallel processing, tuned for complex aggregations over large structured datasets. The line versus Athena: Athena for ad-hoc questions against S3, Redshift for curated data queried hard and repeatedly.'},
 c:{zh:'零售企业把多年销售数据加载进 Redshift，分析师对几十亿行做多维聚合。',en:'A retailer loads years of sales into Redshift so analysts can aggregate billions of rows.'}},
{n:'Amazon EMR',s:0,t:{zh:'托管的大数据处理集群',en:'Managed big-data clusters'},
 d:{zh:'快速搭建和管理 Hadoop、Spark 集群，适合大规模并行处理海量数据，比如复杂转换或训练前的大规模特征处理。',en:'Spins up and manages Hadoop and Spark clusters for large-scale parallel processing — heavy transformations or pre-training feature work.'},
 c:{zh:'几十 TB 原始日志要做复杂清洗，拉一个 Spark 集群跑完就关。',en:'Tens of terabytes of raw logs are cleaned by a Spark cluster that shuts down when finished.'}},
{n:'Amazon QuickSight',s:0,t:{zh:'云原生 BI 与仪表盘',en:'Cloud-native BI dashboards'},
 d:{zh:'连接 S3、Athena、Redshift 等数据源，拖拽生成图表和报表，带一些机器学习驱动的自动洞察（比如自动检测异常波动）。',en:'Connects to S3, Athena, Redshift and more; charts and reports are built by dragging, with some ML-driven insights such as anomaly spotting.'},
 c:{zh:'运营团队想每天看销售仪表盘，连上 Athena 几分钟搭一个自动刷新的面板。',en:'An ops team wires a self-refreshing sales dashboard to Athena in minutes.'}}
],
deep:{t:{zh:'深化：数据湖工程与向量检索（Day 17–18）',en:'Deep dive: data-lake engineering and vector search (Day 17–18)'},
groups:[
{h:{zh:'① 数据湖、Glue 与 Athena（Day 17）',en:'① Data lake, Glue and Athena (Day 17)'},items:[
{zh:'数据分层 **Raw（原样留底）→ Bronze（格式统一）→ Silver（业务清洗，能直接分析）→ Gold（聚合建模，直接能用）**：质量一层比一层高，数据量往往一层比一层小（是聚合导致的，不是清洗导致的）。',en:'Layering: **Raw** (untouched) → **Bronze** (format normalized) → **Silver** (cleaned, analysis-ready) → **Gold** (aggregated, directly usable). Quality rises each layer and volume usually falls — because of aggregation, not cleaning.'},
{zh:'**Parquet 按列存储**：能跳过不需要的列，同类型数据压缩率也更高，比 CSV（行存）又快又省。',en:'**Parquet is columnar**: it skips columns you did not ask for and compresses better because each column holds one type — faster and cheaper than row-based CSV.'},
{zh:'**Athena 按扫描量计费**：分区（跳过文件夹）+ 列存（跳过列）两层优化**相乘不相加**。',en:'**Athena bills by bytes scanned**: partitioning (skip folders) and columnar layout (skip columns) **multiply** rather than add.'},
{zh:'**RAG 数据清洗五步**：①采集/摄入 →②文本提取（格式统一）→③清洗与去重 →④敏感信息处理（PII 检测/脱敏）→⑤结构化与元数据打标（部门/日期/权限，方便过滤和多租户隔离）。',en:'**Five cleaning steps for RAG**: (1) ingest, (2) extract text into one format, (3) clean and de-duplicate, (4) handle sensitive data (PII detection and redaction), (5) structure and tag metadata (department, date, permissions) for filtering and multi-tenant isolation.'}]},
{h:{zh:'② 向量检索与 OpenSearch（Day 18）',en:'② Vector search and OpenSearch (Day 18)'},items:[
{zh:'**Embedding** 把文本变成坐标点，意思相近的坐标离得近；**余弦相似度**只看方向不看大小，是文本检索最常用的度量。',en:'**Embeddings** turn text into points where similar meanings sit close together; **cosine similarity** compares direction rather than magnitude and is the usual metric for text.'},
{zh:'数据量大时精确匹配太慢，用**近似最近邻（ANN）**换速度；**HNSW** 靠多层"路网"（上层稀疏快速跳转、下层密集精细定位）做到又快又相对精确。',en:'Exact search does not scale, so **approximate nearest neighbour** trades a little accuracy for speed; **HNSW** uses layered graphs — sparse upper layers for long jumps, dense lower layers for precision.'},
{zh:'语义检索有盲区：**专有名词、精确编号、具体数字**容易被相邻年份/编号"稀释"，该用 **BM25 关键词匹配**死磕字面，两者**混合检索**取长补短。',en:'Semantic search has blind spots: **proper nouns, exact identifiers and specific numbers** get diluted by neighbouring years or codes. Pair vectors with **BM25 keyword matching** in a hybrid search.'},
{zh:'**OpenSearch Serverless 的 OCU 有最低计费门槛**，没流量也要为保留的最低 OCU 付费——这正是很多团队转向 Aurora + pgvector 的原因。',en:'**OpenSearch Serverless charges a minimum OCU floor** even at zero traffic — exactly why many teams switch to Aurora + pgvector.'}]}]}
},
{
id:'m9', num:'09', t:{zh:'管理与监管',en:'Management & Governance'}, count:8,
sub:{zh:'系统上线之后的那一半工作：谁动了什么、程序说了什么、一次请求走了哪些步、花了多少钱。',en:'The half of the job that starts after launch: who changed what, what the code said, where a request went, and what it cost.'},
services:[
{n:'Amazon CloudWatch',s:3,t:{zh:'监控五件套',en:'The monitoring five-piece set'},
 d:{zh:'**Logs**（存原始文本）、**Metrics**（存数值型指标，是分类容器不是指标本身）、**Alarms**（盯着 Metric 触发告警）、**Logs Insights**（交互式搜索日志）、**Dashboard**（拼成可视化大屏）。',en:'**Logs** (raw text), **Metrics** (numeric series — a container of categories, not a single metric), **Alarms** (watch a metric and fire), **Logs Insights** (interactive log query) and **Dashboards** (the visual wall).'},
 c:{zh:'给 Lambda 的错误率配一条 Alarm，超过阈值就发到 SNS 通知值班。',en:'An alarm on Lambda error rate pages the on-call through SNS when it crosses the threshold.'}},
{n:'AWS CloudTrail',s:2,t:{zh:'谁调用了哪个 AWS API',en:'Who called which AWS API'},
 d:{zh:'记录"谁对 AWS 资源做了什么操作"的控制面审计日志，不关心业务逻辑。每次 AssumeRole、每次删桶都在里面。',en:'A control-plane audit log of who did what to AWS resources; it knows nothing about your business logic. Every AssumeRole and every bucket deletion is in there.'},
 c:{zh:'半夜有人删了一个生产桶，查 CloudTrail 定位到具体身份、时间和来源 IP。',en:'A production bucket disappears overnight; CloudTrail names the identity, the time and the source IP.'}},
{n:'AWS X-Ray',s:2,t:{zh:'分布式请求链路追踪',en:'Distributed request tracing'},
 d:{zh:'把一次请求经过的所有服务串成一条完整链路：**Trace（整趟旅程）包 Segment（每一站）包子分段（站内更细的动作）**，用来回答"到底哪一步慢了"。',en:'Stitches one request across services: a **Trace** (the whole journey) contains **Segments** (each stop) which contain subsegments (finer actions inside a stop) — the tool for "which step is slow".'},
 c:{zh:'一次问答要 8 秒，X-Ray 显示其中 6 秒花在向量检索上，问题不在模型。',en:'An 8-second answer turns out to spend 6 seconds in vector retrieval, not in the model.'}},
{n:'AWS Systems Manager',s:2,t:{zh:'统一的运维操作平台',en:'Unified operations tooling'},
 d:{zh:'一套运维工具集合：**Parameter Store**（集中存配置参数）、**Session Manager**（免密钥、免堡垒机登录 EC2）、**Patch Manager**（自动批量打补丁）。',en:'A toolbox: **Parameter Store** (central configuration), **Session Manager** (shell into EC2 with no keys and no bastion) and **Patch Manager** (bulk patching).'},
 c:{zh:'要登录私有子网的 EC2 排查问题，用 Session Manager 不开任何入站端口就能进去。',en:'Debugging an EC2 host in a private subnet needs no inbound port at all — Session Manager opens the shell.'}},
{n:'AWS CloudFormation',s:2,t:{zh:'AWS 原生声明式 IaC',en:'AWS-native declarative IaC'},

{zh:'**声明式（描述目标状态）vs 命令式（描述操作步骤）**：声明式工具自动对比现状与目标、只执行差异，具备**幂等性**，可以反复安全执行；命令式脚本重复跑容易因为"已存在"而报错或重复创建。',en:'**Declarative (describe the end state) vs imperative (describe the steps)**: declarative tools diff current against desired and apply only the difference, so they are **idempotent** and safe to re-run; imperative scripts break or duplicate on the second run.'},
