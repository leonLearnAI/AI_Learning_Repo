warn:{zh:'来源提醒：本周对应课程的"机器学习"模块，同样没有课程截图，清单与星级来自配套文档估算。另外本周内容天然分两类：模块十一/十二/十三是具体产品，Day 24/26/28/30 里有相当一部分是不对应产品的通用方法论，单独放在"工程方法论"模块。',en:'Source caveat: this maps to the course’s Machine Learning module, again without screenshots, so the list and stars are estimates. Note also that the week splits in two: Modules 11–13 are products, while much of Days 24/26/28/30 is product-agnostic methodology, collected in the separate Engineering Methodology module.'},
modules:[
{
id:'m11', num:'11', t:{zh:'Bedrock 主体与核心机制',en:'Bedrock Core Mechanics'}, count:7, genai:true,
sub:{zh:'Bedrock 是"租用"而不是"自建"：把模型部署和运维整体托管给 AWS，按调用量付费换取不用管底层。这一模块讲的是调用它的那套接口和经济学。',en:'Bedrock is renting, not building: model hosting and operations are AWS’s problem and you pay per call. This module is the interface and the economics of calling it.'},
services:[
{n:'Converse API',s:3,t:{zh:'Bedrock 的统一调用接口',en:'One request format for every model'},
 why:{zh:'不用它的话，每换一个模型家族（Anthropic / Meta / Mistral / Amazon 自家模型……）请求体格式都不一样，应用代码要跟着重写一遍。这也是为什么**只学 Converse，不学更老的 InvokeModel**——后者是每个模型家族各自的原生格式，维护成本随模型数量线性增加。',en:'Without it, every model family (Anthropic, Meta, Mistral, Amazon\u2019s own models…) speaks a different request format, and switching models means rewriting application code. That is exactly why **you learn Converse and skip the older InvokeModel** — the latter is each family\u2019s native format, and maintenance cost grows with every model you add.'},
 d:{zh:'Converse 用统一请求格式屏蔽不同模型家族的差异，换模型只需换一个 `modelId` 字符串，请求体完全不用重写。可以把 Bedrock 理解成"AWS 托管的模型基础设施"——不用自己买 GPU、搭推理服务、处理扩容，这些全部打包"租"给 AWS，按调用量付费。\n\n一次 Converse 调用天生由三个**并列**的部分组成（不是先后发生的步骤）：**messages**（对话历史——模型没有记忆，"它记得你说过什么"是应用层每次把历史重新传一遍实现出来的效果，不是模型自带的能力）、**system**（角色设定，故意和对话历史分开维护，这样不会被用户输入污染或覆盖）、**inferenceConfig**（生成参数：temperature 控制随机程度，低则稳定保守、高则发散多样，本质是影响 token 选择的概率分布形状；top_p 是核采样，划定"累计概率达到阈值"的候选范围而不是固定候选数量，这是最容易和 temperature 搞混的地方；max_tokens 是硬性长度上限，注意 token 不等于字符，一个汉字通常不是恰好一个 token）。',en:'Converse hides the differences between model families behind one request shape — switching models means changing a single `modelId` string, nothing else. Think of Bedrock as "AWS-managed model infrastructure": no GPUs to buy, no inference service to run, no capacity to scale — all of that is rented, billed per call.\n\nA single Converse call is made of three parts that exist **side by side**, not in sequence: **messages** (the conversation history — the model has no memory, "it remembers" is an effect the application builds by resending the history every turn, not a native capability), **system** (role setup, deliberately kept apart from the history so user input cannot pollute or override it) and **inferenceConfig** (generation parameters: `temperature` controls randomness — low is steady, high is varied, and it really shapes the probability distribution the next token is drawn from; `top_p` is nucleus sampling, a cumulative-probability cut-off rather than a fixed candidate count — the detail most often confused with temperature; `max_tokens` is a hard length ceiling, and a token is not a character, especially for CJK text).'},
 pit:{zh:'两个常见误区：一是把 system 提示直接塞进 messages 数组第一条，这样角色设定就混进了对话历史，容易被后续多轮对话稀释或被用户输入的注入攻击覆盖；二是以为调高 max_tokens 能让回答"更聪明"，实际上它只是一个长度硬上限，不影响生成质量，调太高只是让模型有更多空间啰嗦，也会拉高成本。',en:'Two common mistakes: putting the system prompt as the first entry in `messages`, which lets role setup drift into the history and become vulnerable to prompt injection from later user turns; and assuming a higher `max_tokens` makes answers "smarter" — it is only a length ceiling, it does not improve quality, and setting it too high just gives the model room to ramble at greater cost.'},
 c:{zh:'同一个客服后端，从一个模型换到另一个只改配置里的 modelId，请求体不用重写；企业客户第一个问的问题往往是"这些输入输出会不会被拿去训练模型"——答案在本模块最后一项"Bedrock 数据使用承诺"。',en:'A support backend swaps one model for another by changing a single `modelId` — the request body stays the same. The first question an enterprise customer asks is usually "will our input and output train the model?" — the answer is the last item in this module, the data-use commitment.'}},
{n:'ConverseStream',s:3,t:{zh:'流式版本，实现打字机效果',en:'Streaming variant for the typewriter effect'},
 why:{zh:'普通 Converse 要等模型把整句话生成完才一次性把结果给你——如果回答有几百字，用户会盯着一片空白等好几秒。ConverseStream 解决的不是"模型变快了"，而是"用户感觉有没有立刻开始动"，对应可观测性里的 TTFT（首字时间）指标。',en:'Plain Converse waits for the whole answer before returning anything — a few hundred words can mean staring at a blank screen for several seconds. ConverseStream does not make the model faster; it changes whether the answer *feels* instant, which is exactly the TTFT (time-to-first-token) metric.'},
 d:{zh:'调用后返回一连串事件而不是一整块文本：**消息开始**（message start）→ **内容增量**（content block delta，一次次的小片段）→ **消息结束**（message stop）。后端拿到一个事件就转发一个，前端把这些小片段按顺序拼起来渲染，用户看到的"逐字出现"本质就是这些事件被一个个显示出来。\n\n它只解决"感觉"问题，不改变总时长（甚至因为多了事件开销，总时长可能略长于一次性返回）。想在 API Gateway 后面接这套流式，会撞到一个硬限制：API Gateway 有 29 秒超时且**不支持流式转发**，所以真正落地时要换成 Lambda Function URL 或走 ALB，这是它和入口选型互相牵连的地方。',en:'Instead of one block of text you get a stream of events: **message start** → **content block delta**, arriving in small pieces → **message stop**. The backend forwards each event as it lands, and the front end appends the pieces in order — the "typing" the user sees is literally these small events being rendered one after another.\n\nIt only fixes the *feeling*, not the total duration — a stream can even run slightly longer than a one-shot response, once you count the event overhead. Putting this behind API Gateway hits a hard wall: API Gateway has a 29-second timeout and **does not forward streams at all**, so real deployments route it through a Lambda Function URL or an ALB instead — the entry-point choice and the streaming choice are locked together.'},
 pit:{zh:'不要以为"开了流式"就等于换了个响应更快的模型——它只是把同一个答案切成小块提前推给用户，模型思考的总时间没有变短。',en:'Do not mistake "streaming is on" for "the model got faster" — it only slices the same answer into pieces delivered earlier; the model\u2019s total thinking time is unchanged.'},
 c:{zh:'聊天界面在模型还在生成时就逐字显示，用户不用盯着空白等 10 秒；某个团队一开始把 ConverseStream 挂在 API Gateway 后面，流式完全不生效，排查后发现必须换成 Function URL。',en:'The chat UI paints words as they generate instead of showing a blank box for ten seconds. One team first put ConverseStream behind API Gateway and streaming simply did not work — the fix was switching to a Function URL.'}},
{n:'Tool Use（函数调用）',disp:{zh:'Tool Use（函数调用）',en:'Tool Use (function calling)'},s:3,t:{zh:'Agent 的地基',en:'The foundation under every Agent'},
 why:{zh:'大模型能"说"，但它不能真的去查数据库、调外部系统、发邮件——它没有手。Tool Use 是给它一双能被信任的手的机制：模型只负责判断该用哪个工具、传什么参数，真正的执行动作永远留在你自己的代码里。',en:'A model can talk, but it cannot actually query a database, call an external system, or send an email — it has no hands. Tool Use gives it trustworthy hands: the model only decides which tool to call and with what arguments; the actual action always stays in your own code.'},
 d:{zh:'完整往返五步：① 把工具清单和用户问题一起发给模型 → ② 模型判断需要工具，返回一个结构化的调用请求（不是自己去调用）→ ③ 你的代码真正执行这个调用（查数据库、打外部 API）→ ④ 把执行结果（或者失败信息）喂回给模型 → ⑤ 模型基于这个结果生成最终的自然语言回答。**工具描述写得好不好，本质是一个语义匹配问题**——模型是根据工具的名字和描述文本去"理解"什么时候该用它，描述含糊，它就可能选错工具或者压根不用。\n\n互不依赖的工具调用可以并行发起（比如同时查天气和查汇率），有依赖关系的必须串行（先查到订单号才能查物流）。这一整套"调用 → 看结果 → 决定下一步"的循环反复执行多轮，就是 Agent 的推理循环（ReAct）本身——Tool Use 不是 Agent 的一个配件，它是 Agent 存在的前提。',en:'The full round trip has five steps: ① send the tool list and the user\u2019s question together → ② the model decides it needs a tool and returns a structured call (it does not invoke anything itself) → ③ your code actually executes that call (query the database, hit an external API) → ④ the result — or the failure — goes back to the model → ⑤ the model writes the final answer from that result. **How well a tool is described is fundamentally a semantic-matching problem** — the model "understands" when to reach for a tool from its name and description text alone; a vague description means the wrong tool gets picked, or none at all.\n\nIndependent calls can fire in parallel (check the weather and the exchange rate at once); calls with a dependency must be sequenced (you need the order number before you can look up shipping). Repeating this "call, look at the result, decide the next move" loop across turns *is* the Agent reasoning loop (ReAct) — Tool Use is not an accessory to an Agent, it is the precondition for one existing at all.'},
 pit:{zh:'工具执行失败时，最容易踩的坑是让代码自己组织一句话敷衍用户（"抱歉，出错了"），而不是把真实的错误信息原样喂回给模型。模型拿不到真实错误，要么卡在原地反复重试，要么凭空编一个看似合理的结果（幻觉）——诚实地把失败信息喂回去，模型才能换个方式重试或者如实告诉用户。',en:'The easiest mistake when a tool call fails: letting the code compose a generic apology instead of feeding the real error back to the model. Without the real error the model either stalls in a retry loop or invents a plausible-looking result — feed the failure back honestly, and it can try another approach or tell the user the truth.'},
 c:{zh:'用户问"我上个月的账单多少"，模型请求调用 `get_invoice(month)`，代码查库把结果喂回去再作答；如果查询报错（比如账号不存在），把这条错误原样喂回模型，它会回答"没有查到您上个月的账单记录"而不是编造一个数字。',en:'Asked about last month\u2019s bill, the model requests `get_invoice(month)`, your code queries the database, and the model answers from the result. If the query errors out (say, the account does not exist), feeding that error back verbatim lets the model say "no invoice found for last month" instead of inventing a number.'}},
{n:'模型选型方法论',disp:{zh:'模型选型方法论',en:'Model-selection methodology'},s:3,t:{zh:'能力 / 延迟 / 成本三角',en:'The capability / latency / cost triangle'},
 why:{zh:'最常见的浪费不是选错模型，是无脑选最强模型——先问任务实际需要多强的能力，而不是默认拉满，这是控制 GenAI 应用账单的第一道关口。',en:'The most common waste is not picking the wrong model — it is defaulting to the strongest one without asking. Start from what the task actually needs; that single habit is the first line of cost control in a GenAI application.'},
 d:{zh:'能力、延迟、成本三者永远互相博弈，拉高一个通常要牺牲另外两个之一。判断"需要多强"的实用标准：分类、抽取、格式转换这类确定性强、答案唯一的任务，小模型足够甚至更稳定；开放式推理、多步骤规划、需要"权衡取舍"的任务才值得上大模型。\n\n一个容易被忽略的细节：**输出 token 通常比输入 token 贵 3–5 倍**，原因是生成过程要逐个 token 串行计算（每生成一个字都要看完前面所有内容重新推理一次），而读取输入是可以并行处理的。这也是为什么"检索相关片段再回答"（RAG）比"把所有资料一次性塞进上下文"更划算——上下文越长，处理成本的增长是**加速的而不是线性的**，不只是"多花一点钱"那么简单。',en:'Capability, latency and cost are locked in perpetual trade-off — pushing one usually costs one of the other two. A practical test for "how much capability is really needed": classification, extraction and format conversion have one correct answer and a small model handles them fine, often more consistently; open-ended reasoning, multi-step planning and genuine trade-off judgment are where a larger model earns its keep.\n\nAn easily overlooked detail: **output tokens typically cost 3–5× input tokens**, because generation is serial — every new token requires re-processing everything generated so far — while reading the input can be parallelized. This is also why retrieving the relevant slice (RAG) beats stuffing everything into the context: cost grows **faster than linearly** with context length, not just "a bit more expensive."'},
 c:{zh:'分类和抽取这种确定性任务用小模型，复杂推理才升级到大模型，账单能差一个数量级；一个团队把"判断邮件是否是垃圾邮件"这种任务从旗舰模型换成入门模型，效果没有明显下降，成本降了近 90%。',en:'Classification and extraction run on a small model while only complex reasoning escalates — an order of magnitude on the bill. One team moved "is this email spam" off a flagship model onto an entry-level one with no visible quality drop and nearly a 90% cost cut.'}},
{n:'四种计费模式',disp:{zh:'四种计费模式',en:'Four pricing modes'},s:3,t:{zh:'按需 / 预置吞吐量 / 批量推理 / 提示缓存',en:'On-demand / provisioned / batch / prompt caching'},
 why:{zh:'同一个模型、同一段调用，选错计费模式可能是几倍的价差——四种模式本质是在"要不要为稳定容量提前付钱"和"要不要牺牲实时性换折扣"这两条轴上做选择。',en:'The same model, the same call — the wrong pricing mode can mean paying several times over. The four modes really come down to two axes: whether to pre-pay for steady capacity, and whether to trade away real-time delivery for a discount.'},
 d:{zh:'**按需**是默认起点，零承诺、用多少付多少，适合用量不稳定的场景；**预置吞吐量**按时长付费换取稳定保证的容量，适合稳定的大流量，而且是**自定义模型（微调/持续预训练后的模型）唯一的调用入口**——自定义模型不能走按需；**批量推理**面向不追求实时返回的离线任务，价格约为按需的五折；**提示缓存**在"固定前缀 + 高频重复调用"的场景下，靠前缀匹配跳过重复计算大幅降价，前提是前缀本身必须保持不变，稍微改动就会缓存失效。\n\n四种模式不是互斥的，同一个应用完全可以按需处理实时请求、同时用批量推理跑夜间的离线分析任务。',en:'**On-demand** is the default: no commitment, pay for what you use, right for uneven usage. **Provisioned throughput** pays for guaranteed capacity over time and is the only path for a custom (fine-tuned or continued-pre-trained) model — custom models cannot run on-demand at all. **Batch inference** suits offline work with no real-time requirement, at roughly half the on-demand price. **Prompt caching** pays off when a fixed prefix is called often — it skips recomputation via prefix matching, but only while the prefix stays exactly the same; the smallest edit invalidates the cache.\n\nThe four are not mutually exclusive — one application can serve live traffic on-demand while running its nightly offline analysis through batch inference.'},
 pit:{zh:'容易漏掉的一条：想用自定义模型（微调过的模型）却还想用按需计费——这条路走不通，自定义模型必须先买预置吞吐量。',en:'An easy trap: wanting to call a custom (fine-tuned) model on-demand — that path does not exist; custom models require provisioned throughput first.'},
 c:{zh:'一份很长的系统提示 + 知识片段每次都一样，开提示缓存后重复部分的费用大幅下降；夜间批量生成几万份报告摘要用批量推理，成本直接打五折。',en:'A long system prompt plus fixed context repeats on every call; prompt caching cuts the repeated portion sharply. Generating tens of thousands of report summaries overnight runs through batch inference at half price.'}},
{n:'跨区域推理配置文件',disp:{zh:'跨区域推理配置文件',en:'Cross-Region inference profiles'},s:2,t:{zh:'自动路由多区域，带合规副作用',en:'Automatic multi-Region routing, with a compliance catch'},
 why:{zh:'单一区域的模型容量和吞吐是有上限的，跨区域推理把请求自动分散到多个区域处理来突破这个上限——但"自动分散"这四个字，对数据驻留合规要求严格的客户来说就是一颗雷。',en:'A single Region has a capacity ceiling, and cross-Region inference raises it by automatically spreading requests across Regions — but "automatically spread" is exactly the phrase that worries a customer under strict data-residency rules.'},
 d:{zh:'开启后，你的请求可能被路由到配置文件覆盖范围内的任意一个区域处理，从而提升可用性和吞吐、平滑突发流量。代价是这直接触碰**数据驻留**合规要求——数据实际处理发生在哪个地理位置，不再完全由你控制。\n\n面向欧洲客户上线前必须先确认路由范围是否被限制在欧盟境内，这是"欧洲客户三问"（数据驻留 / GDPR / EU AI Act）里最先要过的一关，也是唯一直接和 Bedrock 配置挂钩的一条。',en:'Once enabled, your request may be served by any Region within the profile\u2019s coverage, raising availability and throughput and smoothing traffic spikes. The cost is that this lands squarely on **data-residency** rules — you no longer fully control which geography actually processes the data.\n\nFor a European customer, the routing scope must be confirmed as EU-only before launch — the first of the "three questions European customers ask" (data residency, GDPR, EU AI Act), and the only one wired directly into a Bedrock setting.'},
 c:{zh:'一家欧洲银行的客户明确要求数据不出欧盟，上线前先把跨区域推理的路由范围核对清楚，确认配置文件只覆盖欧盟区域后才批准上线。',en:'A European bank requires data to stay in the EU, so the routing scope is verified before launch — the team confirms the profile only spans EU Regions before sign-off.'}},
{n:'模型定制四种',disp:{zh:'模型定制四种',en:'Four ways to customize a model'},s:2,t:{zh:'微调 / 持续预训练 / 蒸馏 / 自定义模型导入',en:'Fine-tuning / continued pre-training / distillation / custom model import'},
 why:{zh:'提示工程和 RAG 能解决"说什么"的问题，但解决不了"这个模型骨子里不会某种领域知识"或"风格死活稳不下来"——这时候才轮到真正动模型本身的四种手段，也是判断题里最容易和 RAG/提示工程混着问的一组。',en:'Prompt engineering and RAG fix *what to say*, but not "the model fundamentally lacks a domain" or "the style refuses to stay consistent" — that is when you actually touch the model itself, and this group is the one most often mixed up with RAG and prompt engineering in exam questions.'},
 d:{zh:'**微调**用少量标注数据调整输出的风格或格式，改的是"怎么说"；**持续预训练**用海量无标注的领域语料补充整个专业领域的知识，改的是"懂不懂"；**蒸馏**用一个更强的大模型去"教"一个小模型，让小模型在特定任务上逼近大模型效果但成本更低，改的是"值不值"；**自定义模型导入**把自己训练好的开源模型权重直接导入 Bedrock 统一管理调用，本质是"搬家"而不是"再学习"。\n\n决策顺序是一条从便宜到贵的升级阶梯：先看提示工程能不能解决（最便宜，改一下字符串）→ 不行就看是不是缺知识而且这些知识会变（RAG，补知识、动态更新）→ 还不行才考虑微调（改风格格式，要标注数据）或持续预训练（补领域语言和知识，海量语料工程量最大）→ 最后才考虑蒸馏（效果已经够了，纯粹为了降成本）。',en:'**Fine-tuning** shapes style or format from a small labelled set — it changes *how* the model speaks. **Continued pre-training** adds a whole domain\u2019s knowledge from large unlabelled corpora — it changes *what* the model knows. **Distillation** has a strong model teach a small one to near-parity on a specific task at lower cost — it changes what you *pay*. **Custom model import** brings your own trained open-weights model under Bedrock\u2019s management — a *move*, not new learning.\n\nThe decision order is a ladder from cheap to expensive: prompt engineering first (cheapest, just edit a string) → RAG if it is missing knowledge that also changes over time (dynamic) → fine-tuning (style/format, needs labelled data) or continued pre-training (a whole domain\u2019s language, the heaviest lift) → distillation last, purely for cost once quality is already good enough.'},
 c:{zh:'想让客服回复更贴品牌语气，用少量标注过的历史对话做微调，而不是做工程量大得多的持续预训练；某公司已经有一个效果很好但很贵的大模型跑在生产环境，用蒸馏训一个小模型专门顶替其中最高频的那类简单问题，账单立刻降下来。',en:'To match a brand voice, a small set of labelled past conversations is enough to fine-tune — far less work than continued pre-training. A company already running an expensive, high-quality model in production distills a small model to take over the highest-volume simple questions, and the bill drops immediately.'}},
{n:'Bedrock 数据使用承诺',disp:{zh:'Bedrock 数据使用承诺',en:'Bedrock\u2019s data-use commitment'},s:2,t:{zh:'输入输出不用于训练基础模型',en:'Inputs and outputs are not used to train base models'},
 why:{zh:'企业客户愿不愿意把自己的合同、代码、客户数据发给一个大模型，第一个也是唯一绕不开的问题就是"这些数据会不会被拿去训练别人的模型"——这条承诺是整个企业级 GenAI 采购能不能往下谈的前提，比模型参数强不强更重要。',en:'Whether an enterprise will send its contracts, code and customer data to a model comes down to one unavoidable first question: will this data train someone else\u2019s model? This commitment is the gate on the whole enterprise GenAI deal — more decisive than which model is technically strongest.'},
 d:{zh:'客户输入 Bedrock 的内容和模型生成的输出，都不会被用来训练底层的基础模型。这要和负责任 AI 的三方责任划分放在一起理解：模型生产者负责训练数据质量和模型安全测试，模型提供方（这里就是 AWS/Bedrock）负责基础设施安全、数据使用承诺、提供 Guardrails 这类工具，模型消费者（也就是你）负责场景适不适合、有没有做防护、最终结果要不要负责——数据使用承诺正是"模型提供方"这一侧承担的那部分。',en:'Neither what a customer sends into Bedrock nor what the model returns is used to train the underlying base model. Read this alongside the three-way responsible-AI split: the model producer owns training-data quality and safety testing, the model provider (AWS/Bedrock here) owns infrastructure security, the data-use commitment and tools like Guardrails, and the model consumer — you — owns whether the use case fits, whether defences exist, and accountability for the outcome. The data-use commitment is precisely the provider\u2019s share of that split.'},
 c:{zh:'客户法务问"我们的合同文本会不会被拿去训练模型"，这条承诺就是回答的依据，通常还会连带被问到跨区域推理是否会让数据离开约定的区域。',en:'When legal asks whether contract text will train a model, this commitment is the answer — and the next question is usually whether cross-Region inference could move that data outside the agreed Region.'}}
],

groups:[
{h:{zh:'① Converse 与推理参数',en:'① Converse and inference parameters'},items:[
{zh:'模型**没有记忆**——每一轮都要把完整对话历史重新传一遍，"它记得我说过什么"是你实现出来的效果，不是模型自带的能力。',en:'The model has **no memory**. Every turn resends the full history; "it remembers" is an effect you build, not a capability it has.'},
{zh:'三个推理参数：**temperature**（整体随机程度）、**top_p**（划定累计概率达标的候选范围，不是固定数量）、**max_tokens**（硬性长度上限）。',en:'Three knobs: **temperature** (overall randomness), **top_p** (a cumulative-probability cut-off, not a fixed candidate count) and **max_tokens** (a hard length cap).'},
{zh:'system 和 messages 分开设计的意义：角色设定不该混在对话历史里被用户输入污染。',en:'Why `system` is separate from `messages`: the role setup should not sit inside the history where user input can dilute or override it.'}]},
{h:{zh:'② Tool Use 的工程细节',en:'② Engineering details of Tool Use'},items:[
{zh:'**工具描述写得好不好，直接决定模型会不会用对**——本质是一个语义匹配问题，不是配置问题。',en:'**How you describe a tool decides whether the model picks it correctly** — this is a semantic matching problem, not a configuration one.'},
{zh:'不依赖的工具调用可以并行，有依赖关系必须串行。',en:'Independent tool calls can run in parallel; dependent ones must be sequenced.'},
{zh:'工具执行失败，**错误信息也要老实喂回给模型**（不是代码自己组织语言回应用户），否则模型要么卡住要么产生幻觉。',en:'When a tool fails, **hand the error back to the model** rather than having your code improvise a reply — otherwise the model stalls or hallucinates.'}]}]}
},
{
id:'m12', num:'12', t:{zh:'Bedrock 子服务',en:'Bedrock Sub-services'}, count:7, genai:true,
sub:{zh:'围绕基础模型的一圈配套：知识（Knowledge Bases / S3 Vectors）、安全（Guardrails）、运行（AgentCore）、质量（Evaluations）、提示资产（Prompt Management / Flows）。',en:'The ring around the base model: knowledge (Knowledge Bases, S3 Vectors), safety (Guardrails), runtime (AgentCore), quality (Evaluations) and prompt assets (Prompt Management, Prompt Flows).'},
services:[
{n:'Knowledge Bases',s:3,t:{zh:'托管 RAG',en:'Managed RAG'},
 why:{zh:'自己从零搭一套 RAG（分块、嵌入、向量库选型、检索、重排序）工程量不小，还要持续运维；Knowledge Bases 把这条链路托管化，你只需要接入数据源和调策略，不用自己拼基础设施。',en:'Building RAG from scratch — chunking, embedding, choosing a vector store, retrieval, reranking — is real engineering with real upkeep. Knowledge Bases manages that chain for you; you point it at a data source and tune policy, not infrastructure.'},
 d:{zh:'完整链路：数据源（通常是 S3）→ 摄取（分块 + 生成嵌入）→ 向量存储 → 检索（用户提问变成向量，做近似最近邻搜索）→（可选）生成。摄取阶段的**分块策略**有四种：固定分块最简单但对内容不敏感，语义分块按话题转折切，分层分块跟着文档天然的章节结构，自定义 Lambda 应付发票表格这类特殊版式；chunk size 太小会丢上下文，太大会稀释语义，overlap 是为了兜底"切割点不巧导致信息被切断"。\n\n检索阶段有两个经常被忽略的增强：**元数据过滤**做多租户隔离（只能查自己公司的文档）和时效性限定（只查最近一年的政策）；**重排序**是"先粗召回一批候选、再精排出最相关的几条"两阶段设计，用来平衡速度和精度。生成方式二选一：**Retrieve** 只返回检索到的片段，你自己拼提示词再调用模型，可控但要多写代码；**RetrieveAndGenerate** 一步到位直接给综合回答，省事但拼接逻辑是黑盒，改不了。需要自定义拼接逻辑（比如要求引用格式、要求先摘要再回答）必须用前者。',en:'The full chain: a data source (usually S3) → ingestion (chunk, then embed) → a vector store → retrieval (the question becomes a vector for approximate nearest-neighbour search) → optionally generation. Ingestion offers four **chunking strategies**: fixed (simplest, content-blind), semantic (cuts at topic shifts), hierarchical (follows the document\u2019s own chapter structure) and a custom Lambda (odd layouts like invoices and forms). Too small a chunk loses context, too large dilutes meaning, and overlap exists to survive an unlucky cut point.\n\nTwo retrieval-stage enhancements are easy to overlook: **metadata filtering** for multi-tenant isolation (only your company\u2019s documents) and recency limits (only last year\u2019s policy); **reranking** is a two-stage design — a coarse recall of candidates followed by a fine-grained sort — balancing speed against precision. Generation is a choice of two: **Retrieve** returns only the passages, and you assemble the prompt yourself — controllable but more code; **RetrieveAndGenerate** does it all in one call — convenient but the assembly logic is opaque and untunable. Custom assembly (citation formatting, summarize-then-answer) requires the former.'},
 pit:{zh:'"它答错了"排查的第一步永远是看这次检索到的原始片段里到底有没有正确答案，而不是从头重跑整条链路——没检索到相关内容说明问题在检索环节，检索到了但没用上说明问题在生成环节，方向完全不同。',en:'The first move when it gives a wrong answer is always to check whether the correct answer was actually in the retrieved passages — not re-running the whole chain. Nothing relevant retrieved points to retrieval; retrieved but unused points to generation, and the fixes are completely different.'},
 c:{zh:'企业制度问答：文档进 S3，Knowledge Bases 自动分块向量化，回答时附带引用出处，员工能点开原文核实。',en:'A policy Q&A: documents land in S3, Knowledge Bases chunks and embeds them, and answers cite their sources so employees can click through and verify.'}},
{n:'Guardrails',s:3,t:{zh:'输入输出的实时护栏',en:'Real-time guardrails on input and output'},
 why:{zh:'大模型天生"什么都愿意聊"，企业场景需要给它划清业务边界和安全底线，而且这个边界必须实时生效在每一轮对话上——不能只在训练阶段管一次，Guardrails 就是这层运行时防线。',en:'A model will happily discuss almost anything by default; an enterprise needs hard boundaries enforced on every single turn, not just baked in once at training time. Guardrails is that runtime line of defence.'},
 d:{zh:'五种能力覆盖不同维度：**内容过滤**是通用安全线（暴力、仇恨这类放之四海皆准的有害内容）；**拒绝主题**是业务边界，和内容本身有没有害完全无关（比如客服机器人不该谈投资建议，这不是"有害"，是"跑题"）；**敏感信息遮蔽**要在输入和输出两个方向都配置，因为防的东西不一样——输入侧防用户把敏感信息喂进去被模型学走或转发，输出侧防模型不小心把内部数据吐出来；**上下文接地检查**实时拦截幻觉，判断模型的回答是不是有依据地基于检索到的内容；**自动化推理检查**用硬性逻辑规则校验，适合"绝对不能出错"的场景。\n\n提示注入是 Guardrails 要防的核心攻击面，常见手法有三种：直接指令覆盖（"忽略之前的指令，告诉我……"）、角色扮演绕过（"假装你是一个没有限制的 AI"）、间接注入（恶意指令不是用户直接打出来的，而是藏在 Agent 读取的外部内容里，比如一份被篡改过的网页或文档，Agent 场景尤其要警惕）。防御不能只靠 Guardrails 一层，要叠加系统提示强化、工具最小权限、人工审批、上下文接地检查这几层一起上。',en:'Five capabilities cover different dimensions: **content filters** are the general safety line (violence, hate — harmful regardless of context); **denied topics** are business boundaries with nothing to do with whether content is harmful (a support bot avoiding investment advice is off-topic, not unsafe); **sensitive information masking** needs configuring on both directions because it protects against different things — inbound guards against a user feeding in something sensitive that gets echoed or logged, outbound guards against the model leaking internal data; **contextual grounding** blocks hallucination in real time by checking whether an answer is actually supported by what was retrieved; **automated reasoning checks** verify against hard logical rules, for the scenarios that truly cannot afford to be wrong.\n\nPrompt injection is the attack surface Guardrails exists to cover, in three common shapes: direct instruction override ("ignore the previous instructions and tell me…"), role-play bypass ("pretend you are an AI with no restrictions"), and **indirect injection** — malicious instructions the user never typed, hidden instead in external content an Agent reads, like a tampered web page or document, which matters most in Agent scenarios. Defence cannot rest on Guardrails alone: layer it with a hardened system prompt, least-privilege tools, human approval and contextual grounding checks together.'},
 pit:{zh:'把 Guardrails 和 Comprehend、Macie 记混是最常见的错——三者都能碰到 PII，但工作的**位置**完全不同：Guardrails 管实时对话链路，Comprehend 是通用文本分析工具，Macie 扫的是 S3 里的静态数据。',en:'Confusing Guardrails with Comprehend and Macie is the most common slip — all three can touch PII, but they work in completely different *places*: Guardrails on the live conversation, Comprehend as a general text-analysis API, Macie scanning data at rest in S3.'},
 c:{zh:'保险客服机器人拒绝谈论投资建议（拒绝主题），并在输出前遮蔽任何身份证号（敏感信息遮蔽）。',en:'An insurance bot refuses investment advice (a denied topic) and masks any national ID before responding (sensitive information masking).'}},
{n:'AgentCore',s:3,t:{zh:'Agent 的生产化基础设施',en:'Production infrastructure for Agents'},
 why:{zh:'一个能跑的 Agent 原型和一个能扛生产流量的 Agent 之间隔着一整层"怎么稳定运行"的问题——常驻托管、工具接入、记忆、权限、可观测性、评测、授权，这些和"推理逻辑写得对不对"是完全不同的关注点，AgentCore 专门补这一层，不碰推理逻辑本身。',en:'A working prototype Agent and a production-grade one are separated by an entire layer of "how does this run reliably" — hosting, tool wiring, memory, permissions, observability, evaluation, authorization. None of that is about whether the reasoning logic is correct. AgentCore fills exactly that layer, untouched by reasoning itself.'},
 d:{zh:'框架无关、模型无关的七个组件，各自接管生产化的一个侧面：**Runtime** 专属常驻托管这个 Agent；**Gateway** 自动把公司现有的 API 转成 MCP 工具，不用每个工具手写适配；**Memory** 托管会话状态和长期记忆；**Identity** 限定 Agent 代表某个用户去调下游系统时的凭证和权限范围——这是 Agent 场景特有的问题，因为 Agent 不是"你"在直接操作，权限该给多少、代表谁很容易被滥用；**Observability** 是为多轮循环执行路径定制的 X-Ray，普通的分布式追踪看不清 Agent 反复调用工具、反复推理的完整轨迹；**Evaluations** 持续量化 Agent 的行为质量；**Policy**（基于 Cedar）管的是业务层面"这件事能不能做"，和 IAM 管"能不能碰 AWS 资源"是两套不同管辖范围，可以同时存在。\n\n**Bedrock Agents vs AgentCore** 是这一块最容易考的对比：Bedrock Agents 是交钥匙的托管单 Agent 产品，Bedrock 自己管好整个 ReAct 循环，基本不用自己写推理逻辑，代价是绑定 Bedrock 生态；AgentCore 不管推理逻辑，只管这个 Agent（不管用什么框架写的）怎么稳定跑在生产环境，代价是要自己搭推理逻辑这部分。两者不是二选一——常见组合是用 Strands 这类框架写推理逻辑，再用 AgentCore 承载它的生产化运行。',en:'Seven framework- and model-agnostic components, each owning one facet of productionization: **Runtime** hosts the Agent as an always-on process; **Gateway** automatically turns existing company APIs into MCP tools instead of hand-adapting each one; **Memory** manages session state and long-term recall; **Identity** scopes the credentials and permissions an Agent gets when acting for a specific user — a problem unique to Agents, since it is not "you" directly operating, and it is easy to over-grant or misattribute; **Observability** is X-Ray reshaped for multi-turn execution paths, since ordinary distributed tracing cannot make sense of an Agent\u2019s repeated tool calls and reasoning loops; **Evaluations** continuously scores the Agent\u2019s behaviour; **Policy** (Cedar-based) governs whether the business permits an action — a different jurisdiction from IAM\u2019s "can this touch an AWS resource," and the two coexist.\n\n**Bedrock Agents vs AgentCore** is the pairing most likely to be tested: Bedrock Agents is a turnkey managed single-Agent product that runs the whole ReAct loop for you, with almost no reasoning code to write — at the cost of ecosystem lock-in. AgentCore does not touch reasoning at all; it only makes an Agent (written in any framework) run reliably in production — at the cost of building that reasoning yourself. They are not a choice between two options: the common pairing is Strands (or any framework) for the logic, AgentCore to run it.'},
 c:{zh:'用 Strands 写好推理逻辑，交给 AgentCore Runtime 常驻运行，Gateway 把公司现有 API 变成可调工具，Identity 确保这个 Agent 代表某个客户查询时只能看到该客户自己的数据。',en:'Reasoning logic written with Strands runs on AgentCore Runtime, Gateway exposes existing company APIs as callable tools, and Identity ensures the Agent acting for one customer can only see that customer\u2019s own data.'}},
{n:'Bedrock Evaluations',s:2,t:{zh:'自动化 / 人工 / LLM-as-a-judge 三种评测',en:'Automated, human and LLM-as-a-judge evaluation'},
 why:{zh:'GenAI 应用没有传统软件那种"跑测试用例，绿灯就能上线"的确定性——回答质量是模糊连续的，三种评测模式对应研发生命周期的三个不同阶段，而不是三个互相替代的选项。',en:'A GenAI application has no traditional "run the tests, all green, ship it" certainty — answer quality is fuzzy and continuous. The three evaluation modes map to three different stages of the lifecycle, not three interchangeable options.'},
 d:{zh:'**自动化评测**用于早期快速迭代，跑得快成本低，但只能评估有标准答案的场景（比如分类对不对、格式对不对），管不了"这个回答听起来自然不自然"这种主观维度；**人工评测**是上线前的关键把关，最贴近真实用户的感受，但慢且贵，不可能覆盖所有场景；**LLM-as-a-judge** 用另一个模型给回答打分，跑得动大规模、上线后可以持续监控，成本和真实感之间正好卡在自动化评测和人工评测中间。\n\nLLM-as-a-judge 有两种系统性偏差需要主动缓解：**偏好更长的答案**（哪怕更长的答案没有更好）、**位置偏差**（把 A、B 两个候选答案的呈现顺序换一下，打分结果可能跟着变）。缓解办法是给出明确具体的评分指令而不是笼统的"哪个更好"、把两个候选的呈现顺序交换后取两次打分的均值、再用真人抽查校准。评测集起步建议 20–50 道题，覆盖典型场景、边界场景、以及"该拒绝回答"的场景三类，上线后持续把真实失败案例补进评测集。',en:'**Automated** evaluation drives early iteration — fast and cheap, but it only works where a ground truth exists (is the category right, is the format right); it cannot judge whether an answer merely *sounds* natural. **Human** evaluation is the pre-launch gate, closest to real user perception, but slow and costly and can never cover everything. **LLM-as-a-judge** scores answers with another model — scalable enough for continuous post-launch monitoring, sitting between the other two on cost and realism.\n\nLLM-as-a-judge carries two systematic biases worth actively countering: **a preference for longer answers** (even when longer is not better) and **position bias** (swapping the display order of two candidate answers can shift the score). Mitigate with explicit, specific rubrics instead of a vague "which is better," score both orderings and average, and calibrate with human spot checks. Start an evaluation set at 20–50 cases spanning typical scenarios, edge cases, and cases the model *should* refuse, then keep adding real production failures as they surface.'},
 c:{zh:'上线后每天抽样 200 条真实问答交给 judge 模型打分，异常下滑立刻报警，每季度再抽一批交给真人评审校准 judge 模型本身有没有跑偏。',en:'Two hundred real conversations are sampled daily and scored by a judge model, with alerts on any drop, and a quarterly human review batch calibrates whether the judge model itself has drifted.'}},
{n:'Prompt Management',s:2,t:{zh:'提示词的版本化与集中管理',en:'Versioned, centrally managed prompts'},
 why:{zh:'提示词一旦硬编码在代码里，每次调整都要走代码评审和重新部署——对一个几乎每周都要根据真实对话调优的提示词来说，这个流程慢得离谱，也把本该是业务侧的迭代工作锁死在工程师手里。',en:'A hard-coded prompt means every tweak goes through code review and redeployment — absurdly slow for a prompt that genuinely needs weekly tuning from real conversations, and it locks iteration work behind engineers who should not need to own it.'},
 d:{zh:'把提示词从代码里剥离出来集中管理，支持版本控制（对比不同版本的效果、随时回滚到上一个版本）和变量占位符（同一个模板运行时填入不同的变量值，比如客户名字、产品类型），避免提示词像散落的字符串一样硬编码在代码库的各个角落，改一次提示词要满仓库搜索替换。',en:'Lifts prompts out of code into a managed asset with version control (compare versions, roll back instantly) and variable placeholders (one template, different values filled in at runtime — a customer\u2019s name, a product type) — instead of prompt strings scattered across a codebase that need a repository-wide search to change.'},
 c:{zh:'客服提示词要频繁迭代，改提示词不再需要改代码重新部署，业务人员也能在测试环境里试新版本、对比效果，确认没问题再发布到生产。',en:'A support prompt iterates without a code change or redeploy, and non-engineers can try a new version in a test environment, compare results, and publish to production once satisfied.'}},
{n:'Prompt Flows',s:2,t:{zh:'可视化编排轻量工作流',en:'Visual orchestration for light workflows'},
 why:{zh:'不是所有多步骤逻辑都值得上 Step Functions 状态机——"先分类意图、再选模板生成回复"这种两三步的轻量编排，专门写一套状态机是杀鸡用牛刀，Prompt Flows 就是为这个体量而生的。',en:'Not every multi-step flow deserves a Step Functions state machine. "Classify intent, then pick a template" is two or three steps — building a full state machine for that is overkill, and Prompt Flows exists exactly for this scale.'},
 d:{zh:'提供一个可视化拖拽界面，把多个提示词调用、条件判断、数据转换这些步骤像画流程图一样拼接成一个轻量工作流，不需要为这种相对简单的多步骤提示词编排单独写一套 Step Functions 状态机或自己写代码胶水。适合"步骤少、逻辑简单、需要业务人员也能看懂并调整"的场景；一旦编排变复杂（需要人工审批回调、需要精确执行一次、需要跑很长时间），还是应该换回 Step Functions。',en:'A drag-and-drop canvas that strings prompt calls, conditionals and data transforms into a light workflow — no dedicated Step Functions state machine or hand-written glue code for something this simple. It fits flows with few steps, simple logic, and a need for non-engineers to read and adjust it; once the orchestration grows real complexity (human-approval callbacks, exactly-once execution, long runtimes), Step Functions is the right tool again.'},
 c:{zh:'先分类用户意图，再按意图走不同提示词模板生成回复——拖几个节点就搭好，业务人员自己就能加一条新的意图分支。',en:'Classify intent, then route to a different prompt template per intent — a few nodes, no code, and a non-engineer can add a new intent branch alone.'}},
{n:'Amazon S3 Vectors',s:2,t:{zh:'原生支持向量的对象存储，成本最低',en:'Object storage with native vectors, at the lowest cost'},
 why:{zh:'向量库的传统选项（OpenSearch 这类）性能强但计费门槛高，数据量到十亿级、查询又不算频繁时，账单会先于容量成为瓶颈——S3 Vectors 存在的意义就是把"海量、低频、省钱"这类场景的成本打下来。',en:'Traditional vector stores like OpenSearch are powerful but carry a real billing floor. At billion-scale, low-frequency data, cost becomes the bottleneck before capacity ever does — S3 Vectors exists to make exactly that profile affordable.'},
 d:{zh:'⚠️ Day 30 总复盘核对"向量库四选一"时发现的一处真正的内容空白，30 天里完全没讲过，这里补齐。S3 新增一种"向量桶"（Vector Bucket）类型，配一套专属 API 直接存取查询向量，不用自己另外搭任何基础设施。核心卖点是**便宜**——相比 OpenSearch 这类专门优化过的向量库方案，存储和查询成本能降低最多 90%，本质是把"向量检索"能力叠加到了 S3 本身"廉价、海量、免运维"这套特性上。\n\n规模上单个索引最多存 20 亿个向量；性能上比 OpenSearch 慢一些，查询延迟约 100ms 起，不常查的数据一秒内返回，这是它和高性能场景之间的取舍。原生和 Knowledge Bases 集成，可以直接当向量存储后端，也能和 OpenSearch 搭配做**分层策略**：海量低频数据放 S3 Vectors 省钱，高性能实时查询的那部分数据放 OpenSearch，两者不是二选一。',en:'⚠️ A genuine gap surfaced while cross-checking the "four vector stores" comparison during the Day 30 review — never covered across the 30 days, filled in here. S3 adds a "vector bucket" type with a dedicated API to store and query vectors directly, with no separate infrastructure to build. The headline is **cost**: up to 90% cheaper storage and queries than a purpose-built store like OpenSearch, essentially layering vector retrieval onto S3\u2019s existing cheap, massive, ops-free profile.\n\nScale-wise, a single index holds up to two billion vectors. Performance-wise it trails OpenSearch — roughly 100 ms and up per query, with infrequent data returning within a second — the trade for that price. It integrates natively with Knowledge Bases as a vector-store backend, and pairs well with OpenSearch in a **tiered strategy**: bulk, cold vectors in S3 Vectors for cost, the hot, real-time slice in OpenSearch — not an either/or choice.'},
 c:{zh:'给 Agent 建长期记忆，要存下十亿级历史交互、文档和洞察；全放 OpenSearch 成本会随数据量线性暴涨，换成 S3 Vectors 就能用很低的成本存下来，Agent 不用被迫"遗忘"旧的上下文。',en:'Long-term Agent memory needs to hold a billion historical interactions, documents and insights. Storing all of it in OpenSearch would scale cost linearly with volume; S3 Vectors makes it affordable, so the Agent is not forced to "forget" old context.'}}
],
deep:{t:{zh:'深化要点（Day 25、27、29–30）',en:'Deep-dive points (Days 25, 27, 29–30)'},
groups:[
{h:{zh:'① Knowledge Bases 与分块（Day 25）',en:'① Knowledge Bases and chunking (Day 25)'},items:[
{zh:'**四种分块策略**：固定分块（简单粗暴）、语义分块（按话题转折切）、分层分块（跟着文档天然结构）、自定义 Lambda（应付特殊格式）。',en:'**Four chunking strategies**: fixed (blunt), semantic (cut at topic shifts), hierarchical (follow the document’s own structure) and a custom Lambda (odd formats).'},
{zh:'chunk size 太小丢上下文，太大稀释语义；**overlap** 是为了兜底"切割点不巧导致信息被切断"。',en:'Too small and context is lost; too large and meaning is diluted. **Overlap** exists to survive an unlucky cut point.'},
{zh:'**元数据过滤**做多租户隔离和时效性限定；**重排序**靠"先粗召回、再精排"两阶段设计平衡速度和精度。',en:'**Metadata filtering** delivers multi-tenant isolation and recency limits; **reranking** balances speed and precision through a coarse-recall-then-fine-rank design.'}]},
{h:{zh:'② Guardrails 与提示安全（Day 27）',en:'② Guardrails and prompt security (Day 27)'},items:[
{zh:'提示注入三种手法：直接指令覆盖、角色扮演绕过、**间接注入**（藏在外部内容里，Agent 场景尤其要警惕）。',en:'Three injection techniques: direct instruction override, role-play bypass and **indirect injection** hidden in external content — the one that matters most in Agent scenarios.'},
{zh:'防御不能只靠 Guardrails 一层：要叠加系统提示强化、工具最小权限、人工审批、上下文接地检查。',en:'Guardrails alone is not a defence: layer on a hardened system prompt, least-privilege tools, human approval and contextual grounding checks.'},
{zh:'**Guardrails vs Comprehend vs Macie** 的区别是工作**位置**不同：实时对话链路 / 通用文本分析工具 / S3 静态数据扫描。',en:'**Guardrails vs Comprehend vs Macie** differ by *where* they sit: the live conversation path / a general text-analysis API / scanning data at rest in S3.'},
{zh:'上下文接地检查和 Day 26 的忠实度评测是**同一个问题的两种解法**：一个实时拦截，一个离线度量。',en:'Contextual grounding and the Day 26 faithfulness metric are **two answers to one problem**: block it live, or measure it offline.'}]},
{h:{zh:'③ AgentCore 与生产化（Day 29）',en:'③ AgentCore and productionizing (Day 29)'},items:[
{zh:'**IAM 管"能不能碰 AWS 资源"，Policy（Cedar）管"业务上能不能做这件事"**——两者同时存在，管辖范围不同，不是替代关系。',en:'**IAM governs access to AWS resources; Policy (Cedar) governs whether the business permits the action.** They coexist with different jurisdictions — not substitutes.'},
{zh:'**Bedrock Agents vs AgentCore**：前者交钥匙但绑定 Bedrock 生态；后者框架无关模型无关，但推理逻辑要自己搭。',en:'**Bedrock Agents vs AgentCore**: turnkey but tied to the Bedrock ecosystem, versus framework- and model-agnostic but you build the reasoning yourself.'}]},
{h:{zh:'④ 评测三模式（Day 30）',en:'④ Three evaluation modes (Day 30)'},items:[
{zh:'LLM-as-a-judge 的两种系统性偏差：**偏好更长的答案**、**位置偏差**（选项顺序影响打分）；缓解办法是明确评分指令、交换顺序取均值、真人抽查。',en:'Two systematic biases in LLM-as-a-judge: **a preference for longer answers** and **position bias** (order changes the score). Mitigate with explicit rubrics, swapped-order averaging and human spot checks.'},
{zh:'评测集起步 20–50 道题，覆盖典型场景 + 边界场景 + 该拒绝的场景，上线后持续补充新的失败案例。',en:'Start with 20–50 evaluation cases covering the typical, the edge and the ones that should be refused, then keep adding real failures after launch.'}]}]}
},

id:'m13', num:'13', t:{zh:'其他 AI 服务',en:'Other AI Services'}, count:10, genai:true,
sub:{zh:'非 Bedrock 的 AI 服务。阶段一只要建立"知道它解决什么问题、什么时候该想到它"的认知，不需要深挖操作细节。',en:'The AI services outside Bedrock. For Phase 1 it is enough to know what problem each solves and when it should come to mind — no operational depth needed.'},
services:[
{n:'Amazon Textract',s:3,t:{zh:'文档结构化提取',en:'Structured extraction from documents'},
 why:{zh:'普通 OCR 只能把图片变成一整块文字，丢掉了表格的行列关系和表单"字段名对应字段值"的结构——RAG 或自动化流程真正要用的往往是这层结构，不是一整段乱码般的纯文本。',en:'Plain OCR turns an image into one blob of text, losing a table\u2019s row/column structure and a form\u2019s field-name-to-value mapping. What a RAG pipeline or automation actually needs is usually that structure, not an undifferentiated wall of text.'},
 d:{zh:'从扫描件、图片、PDF 里提取文字、**表格结构**和**表单字段的键值对应关系**，不只是简单 OCR，还能理解"这一格属于哪一行哪一列"。它是智能文档处理（IDP）场景的核心工具，也是 RAG 数据清洗链路里"文本提取"这一步最常用的工具，直接决定后续分块和嵌入的质量上限。',en:'Pulls text, **table structure** and **form key-value pairs** out of scans, images and PDFs — understanding which row and column a cell belongs to, not just running OCR. It anchors intelligent document processing and is the usual tool for the "extract text" step of RAG data cleaning, setting a ceiling on everything chunking and embedding do afterward.'},
 c:{zh:'保险公司处理纸质理赔单扫描件，自动提取姓名、保单号、理赔金额，不用人工录入；识别置信度低于阈值的字段会转给 A2I 人工复核，而不是直接采信一个可能错误的结果。',en:'Scanned claim forms yield name, policy number and amount automatically instead of being keyed in — any field below a confidence threshold routes to A2I for human review rather than being trusted outright.'}},
{n:'Amazon Comprehend',s:2,t:{zh:'通用 NLP API，含 PII 检测',en:'General NLP API, including PII detection'},
 why:{zh:'不是每一次文本分析都发生在和大模型对话的当口——数据入湖前脱敏、批量分析历史工单情感，这些场景不需要也不应该经过 Bedrock，Comprehend 补的正是这块"和模型无关的文本分析"空白。',en:'Not every text-analysis task happens mid-conversation with a model — redacting data before it lands in a lake, or bulk-scoring sentiment across old tickets, neither needs nor should go through Bedrock. Comprehend fills exactly that "text analysis with no model in the loop" gap.'},
 d:{zh:'情感分析、实体识别、关键短语、语言检测、**PII 检测**。核心记忆点：它是**通用文本分析工具，不专属 LLM 场景**，可以在任何需要分析文本的地方调用——这正是它和 Guardrails 最本质的分界：Guardrails 挂在实时对话链路上，Comprehend 可以被任何管道调用，跟大模型完全无关也行。',en:'Sentiment, entities, key phrases, language detection and **PII detection**. The thing to remember: it is a **general text-analysis tool, not LLM-specific**, callable anywhere text needs analysis — which is exactly the line between it and Guardrails: Guardrails sits on the live conversation path, Comprehend can be called by any pipeline, with or without a model involved at all.'},
 c:{zh:'数据入湖前先跑一遍 Comprehend 的 PII 检测，把身份信息脱敏后再进 Silver 层，这一步和后面会不会调用 Bedrock 完全无关。',en:'Before data enters the Silver layer, Comprehend PII detection redacts identifiers — a step entirely independent of whether Bedrock is called downstream.'}},
{n:'Amazon Kendra',s:2,t:{zh:'企业级语义搜索引擎',en:'Enterprise semantic search'},
 why:{zh:'不是所有"帮我找东西"的需求都需要一个会说话的大模型——有时候用户只是想要一个搜索结果列表自己判断，Kendra 服务的正是"我要搜"而不是"我要问"这类需求。',en:'Not every "help me find this" need requires a talking model — sometimes the user just wants a results list to judge for themselves. Kendra serves "I want to search," not "I want to ask."'},
 d:{zh:'开箱即用的企业搜索，连接 SharePoint、S3、数据库等数据源，对文档做语义理解后返回**最相关的文档片段/链接**，不像 Knowledge Bases 那样把检索结果喂给大模型生成一段综合性回答。它是"更聪明的企业内部搜索框"（能理解近义表达），不是一个 RAG 组件。',en:'Turnkey enterprise search across SharePoint, S3, databases and more, understanding documents semantically and returning **the most relevant passages or links** — rather than feeding a model to synthesize an answer the way Knowledge Bases does. A smarter internal search box that understands near-synonyms, not a RAG component.'},
 c:{zh:'员工搜"报销流程"，它能理解和"费用报销怎么走"是同一个意思，直接给出最相关的几份内部文档链接，不生成综合回答。',en:'Searching "expense process" also matches "how do I claim costs," returning the right internal document links — with no synthesized answer.'}},
{n:'Amazon Q Business',s:2,t:{zh:'开箱即用的企业知识助手',en:'Turnkey enterprise knowledge assistant'},
 why:{zh:'自己搭一套 Knowledge Bases + Bedrock 的 RAG 系统需要真正的工程团队；不是每家公司都有这个资源，Q Business 存在的意义就是把这条路径压缩成"接入数据源、几天上线"。',en:'Building Knowledge Bases plus Bedrock into a real RAG system needs an actual engineering team — not every company has one. Q Business exists to compress that whole path into "connect the data source, live in days."'},
 d:{zh:'不用写代码的成品级企业问答应用，接入数据源后员工直接用自然语言提问、得到综合性回答，背后的 RAG 检索和生成环节都已经封装好。跟自己用 Knowledge Bases + Bedrock 搭一套系统相比，省去大量开发工作，但定制化程度和灵活度也相应最低——这是它在"三选一"里的位置，处于 Knowledge Bases 和 Kendra 之外的第三个档位。',en:'A finished, no-code enterprise Q&A application: connect data sources and staff simply ask, getting a synthesized answer, with retrieval and generation packaged behind the scenes. Compared with building on Knowledge Bases plus Bedrock yourself, it saves a great deal of development at the cost of the least customization — the third rung in the three-way choice, beyond both Knowledge Bases and Kendra.'},
 c:{zh:'中型企业没有工程资源自己搭 RAG，直接采购 Q Business，接入内部文档几天内就能用起来。',en:'A mid-sized firm without engineers to build RAG buys Q Business and is live on internal documents within days.'}},
{n:'SageMaker JumpStart',s:2,t:{zh:'一键部署开源模型到专属端点',en:'One-click open-model deployment to your own endpoint'},
 why:{zh:'Bedrock 只托管它自己精选的一批基础模型；想用某个特定的开源模型（比如一个专门的图像分类或小众语言模型），Bedrock 未必有，JumpStart 补的正是这条"我要用一个具体的开源模型"的路径。',en:'Bedrock only hosts its own curated set of base models. Wanting one specific open model — a niche image classifier, a small-language model — may simply not be on that list, and JumpStart is the path for exactly that need.'},
 d:{zh:'从开源模型库一键部署成**你自己独占的推理端点**——这和 Bedrock"调用别人已经托管好的共享模型"是根本不同的两件事：JumpStart 部署出来的资源是专属于你的，需要你自己承担扩容和运维（虽然部署过程本身是一键的）。',en:'Deploys an open model from a catalogue into **an endpoint that is exclusively yours** — fundamentally different from Bedrock, where you call a shared model someone else already hosts. What JumpStart deploys belongs to you alone, including the scaling and upkeep that follow, even though the deployment step itself is one click.'},
 c:{zh:'团队要用一个特定的开源图像分类模型，不想自建 GPU 服务器和推理服务，用 JumpStart 几步就部署成一个可以直接调用的 API 端点。',en:'A team needs one specific open image-classification model and gets a callable API endpoint without building GPU infrastructure from scratch.'}},
{n:'Amazon Lex',s:2,t:{zh:'对话机器人框架（意图 + 槽位）',en:'Conversational bot framework (intents and slots)'},
 why:{zh:'直接调大模型做对话式界面，每一轮都要靠提示词"猜"用户想干什么；流程固定、信息收集步骤明确的场景（订票、报障）不需要这么灵活，Lex 把这类场景结构化成可预测的状态机。',en:'Calling a model directly for a conversational UI means every turn relies on the prompt to "guess" intent. Fixed flows with clear information-gathering steps — booking a flight, filing a fault report — do not need that much flexibility, and Lex structures exactly this kind of scenario into a predictable state machine.'},
 d:{zh:'核心概念是**意图**（用户想干什么，比如"订机票"）和**槽位**（完成这件事需要收集的具体信息，比如出发地、目的地、日期）。比直接调大模型更结构化、更可预测，适合流程固定的场景，现在也常和 Bedrock 配合：Lex 做流程骨架，大模型处理更灵活的自然语言理解那部分。',en:'Built on **intents** (what the user wants — "book a flight") and **slots** (the specific information needed to do it — origin, destination, date). More structured and predictable than calling a model directly, and suited to fixed flows; it is often paired with Bedrock now, with Lex as the skeleton and the model handling the more flexible language-understanding pieces.'},
 c:{zh:'订票机器人识别"订机票"意图后，依次收集出发地、目的地、日期，槽位齐了再调后端系统完成预订。',en:'A booking bot recognizes the intent, collects origin, destination and date, then calls the reservation system once every slot is filled.'}},
{n:'Augmented AI (A2I)',s:2,t:{zh:'人工审核回环',en:'Human review loop'},
 why:{zh:'自动化流程不可能对每一次判断都 100%确信——直接采信一个低置信度的结果可能酿成实际损失，A2I 补的是"拿不准的时候该怎么办"这道最后防线，而不是提升准确率本身。',en:'An automated pipeline can never be certain of every single judgment. Trusting a low-confidence result outright can cause real damage — A2I is the last line for "what happens when we are unsure," not a way to raise accuracy itself.'},
 d:{zh:'在自动化流程里插一道"低置信度结果转人工审核"的环节，人工确认或修正后再继续走后面的流程。注意它**不评估任何东西**——不判断结果好不好，只负责在结果不确定时把它路由给人，这是它和 Bedrock Evaluations、SageMaker Clarify 最本质的区别。',en:'Inserts a "low confidence goes to a human" step into an automated pipeline, letting a person confirm or correct before the flow continues. Note that it **evaluates nothing** — it does not judge whether a result is good, only routes uncertain ones to a person, which is the fundamental line between it and Bedrock Evaluations or SageMaker Clarify.'},
 c:{zh:'Textract 识别身份证时置信度低于 90%，自动转给人工复核而不是直接采信，复核结果再流入下游系统。',en:'When Textract falls below 90% confidence on an ID card, the image goes to a reviewer instead of being trusted, and the reviewed result then flows downstream.'}},
{n:'SageMaker Model Monitor / Clarify / Model Registry',s:2,t:{zh:'传统 ML 的监控、可解释性与版本管理',en:'Monitoring, explainability and versioning for classic ML'},
 d:{zh:'服务"自己训练/部署传统机器学习模型"这条线，和生成式 AI 关系不大，但考纲要求能区分：**Model Monitor** 盯生产环境的数据漂移（输入数据分布和训练时不一样了）；**Clarify** 检测模型偏差、解释模型为什么做出某个判断（这个 Clarify 和评测那棵决策树里出现的是同一个服务，只是场景是传统 ML 而不是生成式模型）；**Model Registry** 管不同版本模型的效果记录和血缘关系。',en:'For teams training and hosting classic ML — little to do with generative AI, but the exam expects the distinction: **Model Monitor** watches for data drift in production (the input distribution no longer matches training); **Clarify** detects bias and explains a model\u2019s decisions (the same Clarify that appears in the evaluation decision tree, just applied to classic ML rather than a generative model); **Model Registry** tracks version history and lineage.'},
 c:{zh:'银行的贷款审批打分模型，用 Model Monitor 发现输入分布漂移后触发重新训练流程。',en:'A loan-scoring model triggers a retraining pipeline when Model Monitor detects input drift.'}},
{n:'Transcribe / Polly / Rekognition',s:1,t:{zh:'语音转文字、文字转语音、图像识别',en:'Speech-to-text, text-to-speech, image recognition'},
 d:{zh:'三个成熟的传统 AI 服务，在 GenAI 应用里经常作为**输入输出的转换层**配合大模型使用——大模型本身只处理文本，这三个服务负责把语音、图像这些非文本模态转换成文本，或者反过来。',en:'Three mature services that typically act as the **input/output conversion layer** around a model in a GenAI application — the model itself only handles text, and these three convert non-text modalities like speech and images into text, or back again.'},
 c:{zh:'语音客服：Transcribe 转文字 → Bedrock 生成回答 → Polly 转语音播放，形成语音进语音出的完整体验。',en:'A voice agent: Transcribe converts speech to text, Bedrock answers, Polly speaks it back — a complete voice-in, voice-out experience.'}},
{n:'SageMaker 训练相关（HyperPod / Processing / Ground Truth / Neo）',disp:{zh:'SageMaker 训练相关（HyperPod / Processing / Ground Truth / Neo）',en:'SageMaker training tools (HyperPod / Processing / Ground Truth / Neo)'},s:0,t:{zh:'模型训练工具（考纲不考，跳过）',en:'Training tooling (out of scope for the exam)'},
 d:{zh:'HyperPod（大规模分布式训练集群管理）、Processing（数据预/后处理作业）、Ground Truth（人工标注数据服务）、Neo（模型编译优化）。**AIP-C01 考纲明确说明不考模型训练和高级 ML 技术**，阶段一可以完全跳过，只需要知道这几个名字存在、大致服务于"从零训练模型"这条线即可，不用记细节。',en:'HyperPod (distributed training clusters), Processing (pre/post-processing jobs), Ground Truth (labelling) and Neo (compilation). **AIP-C01 explicitly excludes model training and advanced ML**, so Phase 1 can skip all of it — just enough to recognize the names and know they serve "training a model from scratch," with no details to memorize.'},
 c:{zh:'——（阶段一不需要案例，知道存在即可）',en:'— (no case needed in Phase 1; knowing they exist is enough)'}}
]
},
{
id:'mc', num:'C', t:{zh:'工程方法论（非产品）',en:'Engineering Methodology (not products)'}, count:5, genai:true, concept:true,
sub:{zh:'这部分不对应任何打星的 AWS 产品，但恰恰是 AIP-C01 判断题最集中的地方：RAG 工程、提示工程、Agent 工程、评测、负责任 AI。',en:'None of this maps to a starred AWS product, yet it is where AIP-C01 judgment questions cluster: RAG engineering, prompt engineering, Agent engineering, evaluation and responsible AI.'},
services:[
{n:'RAG 工程 · 四大指标与四种故障',disp:{zh:'RAG 工程 · 四大指标与四种故障',en:'RAG engineering \u00b7 four metrics, four failure modes'},s:3,t:{zh:'先定位环节，再修具体问题',en:'Locate the stage first, then fix the problem'},
 why:{zh:'"RAG 效果不好"是一句几乎没有信息量的抱怨——检索和生成是两个完全独立的环节，各自的失败模式、各自的修法都不一样，不先分流就只能盲目地把两边都试一遍，浪费大量排查时间。',en:'"RAG isn\u2019t good enough" carries almost no information by itself — retrieval and generation are two independent stages with different failure modes and different fixes. Without forking first, debugging becomes trying everything on both sides at once.'},
 d:{zh:'**四大指标分两组**，每组内部是一对跷跷板：检索这一组是**上下文召回率**（该找到的有没有都找到）和**上下文精确率**（找到的东西里有多少是真正相关的）——放宽检索条件能提高召回率但会拉低精确率，反之亦然；生成这一组是**答案忠实度**（回答有没有严格基于检索到的内容，有没有编造）和**答案相关性**（回答有没有真正对上用户的问题），这两个也会互相牵制，比如为了绝对忠实而堆砌大量原文引用，反而会伤害相关性和可读性。\n\n**四种故障模式**和四个指标一一对应：什么都没检索到 → 召回率低（要查分块策略、嵌入模型、query 改写）；检索到的东西是错的 → 精确率低（要查元数据过滤、重排序逻辑）；检索到了正确内容但回答里没体现 → 忠实度问题（模型没有"用上"检索结果，可能是提示词拼接方式有问题）；上下文塞得太长被稀释 → 可能同时伤忠实度和相关性（信息被无关内容淹没）。',en:'**Four metrics fall into two see-saw pairs.** On retrieval: **context recall** (did you find everything relevant) and **context precision** (of what you found, how much is actually relevant) — loosening retrieval raises recall but drags down precision, and vice versa. On generation: **answer faithfulness** (is the answer strictly grounded in what was retrieved, with nothing invented) and **answer relevance** (does the answer actually address the question) — over-optimizing for faithfulness by piling on verbatim quotes can hurt relevance and readability.\n\n**Four failure modes map one-to-one to the four metrics**: nothing retrieved → low recall (check chunking, the embedding model, query rewriting); wrong things retrieved → low precision (check metadata filtering, reranking); the right passage was retrieved but never shows up in the answer → a faithfulness problem (the model did not use what it was given, often a prompt-assembly issue); too much context crammed in → can hurt both faithfulness and relevance at once, drowning the signal in noise.'},
 pit:{zh:'最容易浪费时间的排查方式是"从头到尾把整条链路重新试一遍"——正确顺序永远是先看这次检索到的原始片段里有没有正确答案，这一步就能把问题范围砍掉一半。',en:'The most time-wasting habit is re-running the entire chain from scratch. The correct order is always to check first whether the correct answer was actually in the retrieved passages — that single check eliminates half the search space immediately.'},
 c:{zh:'引用溯源本身不是一个评测指标，而是给忠实度提供一份用户能自己核实的证据链——回答附带"依据来自第 3 段"，用户点开就能验证模型有没有编造。一个团队上线后忠实度评分持续偏低，排查发现是检索到的片段被截断得太短，模型"看不全"上下文，扩大 chunk size 后忠实度明显回升。',en:'Source citation is not a metric itself — it is the evidence chain that lets a user verify faithfulness themselves: an answer tagged "from passage 3" can be checked with one click. One team saw persistently low faithfulness scores after launch and traced it to overly short retrieved chunks — the model literally could not see enough context; widening the chunk size fixed it.'}},
{n:'Agent 工程 · 推理循环与多 Agent',disp:{zh:'Agent 工程 · 推理循环与多 Agent',en:'Agent engineering \u00b7 reasoning loop and multi-agent'},s:3,t:{zh:'ReAct、记忆、MCP、协作模式',en:'ReAct, memory, MCP and collaboration patterns'},
 why:{zh:'Tool Use 讲的是"一次调用一个工具"的机制，Agent 工程讲的是"把这个机制串成一连串自主决策"——多了记忆、多了协作、也多了失控的风险，这些是 Tool Use 本身不涉及的新问题。',en:'Tool Use is the mechanics of calling one tool once. Agent engineering is stringing that mechanism into a chain of autonomous decisions — which brings in memory, collaboration and new ways for things to go wrong that Tool Use alone never has to face.'},
 d:{zh:'**推理循环（ReAct，Reason + Act）**就是把 Tool Use 的往返反复执行多轮：模型看一眼当前情况、决定下一步调用哪个工具或者要不要直接回答、拿到结果后再看一眼、如此反复，由模型自己判断"信息够不够、能不能给最终答案"，而不是代码写死轮数。\n\n**短期记忆**靠在每一轮里重复传递完整的对话历史实现，只在这一轮会话内部有效；**长期记忆**靠外部存储加检索实现（比如存进向量库，下次对话开始时先检索相关的历史），能跨越多次独立的会话——这是两套解决不同时间尺度问题的机制，不要混为一谈。**MCP（Model Context Protocol）**是工具接入的标准化协议：没有它，每个 Agent 框架要接一个新工具就要重新写一遍适配代码；有了 MCP，工具只需要实现一次协议，任何遵循 MCP 的框架都能直接用，类比"标准插座"——插座标准化之后，电器和插座不用互相为对方定制。',en:'The **reasoning loop (ReAct — reason + act)** repeats the Tool Use round trip across turns: the model looks at the current state, decides whether to call a tool or answer directly, looks again once it has a result, and repeats — with the model itself judging when it has enough, not a hard-coded turn limit.\n\n**Short-term memory** works by resending the full conversation history on every turn, valid only within that one session. **Long-term memory** works through external storage plus retrieval (store it in a vector database, retrieve relevant history at the start of the next session), spanning across separate sessions — two mechanisms for two different time scales, not interchangeable. **MCP (Model Context Protocol)** standardizes how tools connect: without it, every Agent framework re-writes its own adapter for every new tool; with it, a tool implements the protocol once and any MCP-compliant framework can use it — a standard socket, so appliances and outlets stop being custom-built for each other.'},
 pit:{zh:'**多 Agent 协作模式**从可控到自由排成一列：Supervisor-Worker（一个主管 Agent 分派任务给多个 worker）、Workflow（固定顺序接力）、Graph（有分支和汇合的更复杂接力网络）、Swarm（没有中心、自组织协作）——复杂度依次上升，可控性依次下降，越靠后越难预测也越难调试。**Agent 失控的三种形式**：死循环（一直觉得"还不够"，靠设最大轮数上限兜底）、工具滥用（调用了不该调的工具）、越权（代表用户做了超出授权范围的事，这正是 AgentCore Identity 和 Policy 要防的）。',en:'**Multi-agent patterns** run from controllable to loosely coupled: supervisor-worker (one Agent dispatches to several workers), workflow (a fixed-order relay), graph (a relay network with branches and joins) and swarm (no center, self-organizing) — complexity rises and controllability falls down that list, and the later patterns get harder to predict or debug. **Three ways an Agent goes wrong**: infinite loops (it never decides it has enough — cap the turns), tool misuse (calling something it should not) and privilege overreach (acting beyond what it was authorized to do on a user\u2019s behalf — exactly what AgentCore Identity and Policy exist to prevent).'},
 c:{zh:'一个多 Agent 客服系统用 Supervisor-Worker：主管 Agent 先判断问题类型，再分派给"账单专家"或"技术支持专家"两个 worker Agent，各自用短期记忆处理这一轮对话，遇到需要历史工单的场景再从长期记忆里检索。',en:'A multi-agent support system uses supervisor-worker: a supervisor classifies the issue and routes it to a "billing" or "technical" worker Agent, each handling this session with short-term memory and pulling from long-term memory only when a past ticket is relevant.'}},
{n:'什么时候不该用 Agent',disp:{zh:'什么时候不该用 Agent',en:'When not to use an Agent'},s:3,t:{zh:'三种场景一律回到 Step Functions',en:'Three cases that belong to Step Functions'},
 why:{zh:'Agent 是这几年最容易被"为了用而用"的技术——它很吸引人，但代价是贵、慢、不可预测。判断该不该用 Agent，不是看这个场景"能不能"用 Agent 做，而是看有没有更便宜、更可控的方案已经够用。',en:'Agents are the technology most likely to be reached for just because they exist — they are exciting, but expensive, slower and unpredictable. The question is never whether an Agent *could* do the job, but whether a cheaper, more predictable option already does.'},
 d:{zh:'三种场景一律该用 Step Functions 而不是 Agent：**流程能被完全枚举**（设计阶段就能把每一步和每一个分支想清楚）、**需要严格不出错的准确性**（模型的临场判断天然不是百分之百可靠）、**需要极高速度和并发**（Agent 的多轮推理循环天然比一条写死的状态机慢）。Agent 唯一不可替代的场景，是"下一步该做什么"必须依赖模型临场判断、步骤本身在设计阶段根本无法穷举。\n\n用 Agent 处理能被枚举的流程，本质是花更多的钱买一个更差的可预测性——Step Functions 便宜、快、天然自带完整的执行审计记录，Agent 在这三点上都处于劣势，它的价值只体现在真正需要"临场判断"的那部分工作上。',en:'Three scenarios always belong to Step Functions instead: **the flow can be fully enumerated** (every step and branch is knowable at design time), **correctness must be guaranteed** (a model\u2019s in-the-moment judgment is not, by nature, 100% reliable), and **speed and concurrency dominate** (a multi-turn reasoning loop is inherently slower than a state machine with fixed branches). The one case an Agent is irreplaceable for is when the next step genuinely depends on the model\u2019s judgment and the steps cannot be enumerated in advance.\n\nUsing an Agent for an enumerable flow is, at its core, paying more for worse predictability: Step Functions is cheaper, faster and comes with a full execution audit trail built in — an Agent loses on all three fronts, and earns its cost only on the slice of work that genuinely needs in-the-moment judgment.'},
 c:{zh:'"发票录入 → 校验金额 → 超额转审批 → 入账"每一步都能提前想清楚，用 Step Functions；"帮我查清这个客户为什么流失"没法提前枚举步骤（要查什么数据、查完下一步看什么，完全取决于上一步查到了什么），才用 Agent。',en:'"Ingest invoice → validate amount → escalate if over limit → post to ledger" is fully knowable in advance, so Step Functions. "Work out why this customer churned" cannot be enumerated (what to check next depends entirely on what the last check found), so an Agent.'}},
{n:'提示工程 · 结构化输出与职责划分',disp:{zh:'提示工程 · 结构化输出与职责划分',en:'Prompt engineering \u00b7 structured output and division of labor'},s:2,t:{zh:'system 与 messages 各司其职',en:'Keep system and messages doing different jobs'},
 why:{zh:'提示工程是解决模型行为问题最便宜的手段，永远排在 RAG、微调之前先试——但"便宜"不代表"随意"，几个基本的工程习惯决定了提示词是稳定可维护的资产还是一堆脆弱的字符串。',en:'Prompt engineering is the cheapest lever for fixing model behaviour, and always the first thing to try before RAG or fine-tuning. But "cheap" does not mean "casual" — a few basic habits decide whether a prompt is a stable, maintainable asset or a pile of brittle strings.'},
 d:{zh:'**结构化输出**要求模型稳定返回固定格式（最常见是 JSON），让下游代码能直接解析，而不是对着一段自然语言做脆弱的字符串切分——切分逻辑一旦模型的措辞稍微变化就会崩。**system 与 user（messages）提示的职责划分**：角色设定、行为规则放在 system，独立于对话历史维护，这样不会被多轮对话或者用户输入意外覆盖，也不会被提示注入轻易篡改。**提示词的版本管理与迭代**对应 Prompt Management 这个产品——提示词值得被当成需要版本控制、需要 A/B 对比的工程资产，而不是写死在代码里的字符串常量。\n\n提示注入和防御属于安全范畴，在 Guardrails 那一节详细展开，这里只需要知道：提示工程本身也是防御的第一道线——把系统提示写得足够明确、清楚划定模型的能力边界，能从源头上降低被绕过的概率。',en:'**Structured output** asks the model to reliably return a fixed shape — usually JSON — so downstream code parses it directly instead of doing brittle string-splitting on natural language, which breaks the moment the model\u2019s wording shifts slightly. **The division of labour between system and user (messages) prompts**: role setup and behavioural rules live in `system`, maintained apart from the conversation history, so they cannot be accidentally overwritten across turns or easily tampered with via injection. **Prompt versioning and iteration** is exactly the Prompt Management product — prompts deserve to be treated as engineering assets worth version control and A/B comparison, not string constants baked into code.\n\nPrompt injection and its defences are a security topic covered under Guardrails; the one thing worth knowing here is that prompt engineering itself is the first line of defence — a system prompt with explicit, clearly bounded capabilities lowers the odds of being bypassed in the first place.'},
 c:{zh:'要求模型只返回 `{"intent": "...", "confidence": 0.x}`，下游代码就能直接解析而不用做脆弱的文本切分；提示词版本从 v3 改到 v4 后线上忠实度评分下降，靠 Prompt Management 的版本对比迅速回滚到 v3 定位问题。',en:'Requiring `{"intent": "...", "confidence": 0.x}` lets downstream code parse directly instead of doing brittle string-slicing. When a prompt update from v3 to v4 dropped the live faithfulness score, Prompt Management\u2019s version comparison let the team roll back to v3 instantly while investigating.'}},
{n:'负责任 AI 与合规',disp:{zh:'负责任 AI 与合规',en:'Responsible AI and compliance'},s:3,t:{zh:'六个维度、三方责任、欧洲客户三问',en:'Six dimensions, three parties, three questions from European customers'},
 why:{zh:'负责任 AI 不是一个可以事后补的合规检查表，它把前面九个模块讲过的具体机制（引用溯源、Guardrails、评测、可观测性）重新用"谁对什么负责"的视角串了一遍——这也是它成为整个阶段一收尾内容的原因。',en:'Responsible AI is not a compliance checklist bolted on afterward — it re-threads the concrete mechanisms from earlier modules (citations, Guardrails, evaluation, observability) through the lens of "who is accountable for what," which is exactly why it closes out Phase 1.'},
 d:{zh:'**六个维度**：公平性（模型判断有没有系统性偏向某群体）、可解释性（对应引用溯源——回答有没有可核实的依据）、隐私与安全（对应 Guardrails 的 PII 遮蔽）、稳健性（能不能扛住提示注入这类攻击）、治理（需要评测集 + 可观测性 + Evaluations 三者共同支撑，不是靠一份文档）、透明度（清楚告知用户正在和 AI 交互，而不是让人误以为在和真人对话）。\n\n**三方责任划分**是判断题里最容易考的框架：**模型生产者**负责训练数据质量和模型本身的安全测试；**模型提供方**（这里是 AWS/Bedrock）负责基础设施安全、数据使用承诺、提供 Guardrails 这类工具；**模型消费者**（也就是你，构建应用的一方）负责这个场景适不适合用 AI、有没有做好防护、最终结果出了问题要不要负责——责任不会因为"AWS 提供了 Guardrails"就自动转移给 AWS，最终场景选择和防护措施是消费者自己的事。',en:'**Six dimensions**: fairness (does the model systematically favour or disadvantage a group), explainability (citations — can the answer be verified), privacy and security (Guardrails PII masking), robustness (can it survive attacks like injection), governance (needs evaluation sets, observability and Evaluations together — not a single document) and transparency (clearly telling users they are talking to AI, not letting them assume a human).\n\nThe **three-way responsibility split** is the framework most likely to be tested: the **model producer** owns training-data quality and the model\u2019s own safety testing; the **model provider** (AWS/Bedrock here) owns infrastructure security, the data-use commitment, and tools like Guardrails; the **model consumer** — you, building the application — owns whether the use case is appropriate, whether defences are actually in place, and accountability when the outcome goes wrong. Responsibility does not transfer to AWS just because AWS supplied Guardrails — the final use-case choice and its safeguards remain the consumer\u2019s job.'},
 pit:{zh:'**欧洲客户三问**：数据驻留（直接关联跨区域推理配置文件的路由范围）、GDPR（被遗忘权、数据最小化收集、数据处理协议）、EU AI Act（按风险分级监管，风险越高需要越多合规文档）。关键认知：评测报告和可观测性记录在这个语境下不只是工程实践的副产品，**它们本身就是合规证据**——监管问起来，能拿出评测集覆盖率和执行审计记录，比口头保证有说服力得多。',en:'**Three questions European customers ask**: data residency (directly tied to the routing scope of a cross-Region inference profile), GDPR (right to erasure, data minimization, processing agreements) and the EU AI Act (risk-tiered regulation, more documentation at higher risk). The key insight: in this context, evaluation reports and observability records are not just engineering by-products — **they are the compliance evidence itself**. When a regulator asks, evaluation-set coverage and execution audit logs carry far more weight than a verbal assurance.'},
 c:{zh:'一家跨国 SaaS 公司在欧洲上线 GenAI 功能前，先核对跨区域推理路由范围是否限定在欧盟境内（数据驻留），再确认用户数据删除请求能触达向量库里的嵌入（GDPR 被遗忘权），最后按 EU AI Act 的风险分级准备好对应的评测和可观测性文档。',en:'Before launching a GenAI feature in Europe, a multinational SaaS company first confirms the cross-Region routing scope stays within the EU (residency), then makes sure a user\u2019s deletion request also reaches embeddings in the vector store (GDPR erasure), and finally prepares evaluation and observability documentation matching its EU AI Act risk tier.'}}
]
}]};

  {n:{zh:'② 模型返回结构化调用请求',en:'② The model returns a structured call'},note:{zh:'它只是"说出"要调哪个工具、传什么参数。不依赖的调用可以并行。',en:'It merely states which tool and which arguments. Independent calls can run in parallel.'}},

const T=(o)=>!o?'':(typeof o==='string'?o:(o[LANG]||o.zh||''));
const md=(s)=>T(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/`(.+?)`/g,'<code>$1</code>')
  .replace(/\n\n/g,'<br><br>')
  .replace(/\n/g,'<br>');
const esc=(s)=>T(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const stars=(n)=>'★'.repeat(n)+'☆'.repeat(3-n);
const $=(s)=>document.querySelector(s);

/* service index */
const SVC={};
UNITS.forEach(m=>m.services.forEach(s=>{
  s._m=m; s._genai=!!m.genai; SVC[s.n]=s;}));
function svcTitle(s){return s.disp?T(s.disp):s.n;}

/* ---------- rail ---------- */
const TAIL_VIEWS=['pano','mega','quiz'];
function renderRail(){
 const infra=UNITS.filter(u=>!u.genai);
 const genai=UNITS.filter(u=>u.genai);
 const item=(id,label,count)=>`<a href="#" data-v="${id}" class="${id===CUR?'on':''}"><span>${label}</span>${count!==undefined?`<i>${count}</i>`:''}</a>`;
 const uItem=u=>item(u.id,`${u.num} · ${T(u.t)}`,u.services.length);
 $('#rail').innerHTML=
  `<h4>${T(I18N.navInfra)}</h4>${infra.map(uItem).join('')}
   <h4>${T(I18N.navGenai)}</h4>${genai.map(uItem).join('')}
   <h4>${T(I18N.navSummary)}</h4>
   ${item('pano',T(I18N.views.pano))}
   ${item('mega',T(I18N.megaTitle))}
   ${item('quiz',T(I18N.views.quiz),QUIZ.length)}`;
 $('#rail').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.v);});
}
let CUR='m1', Q='';
function go(v){CUR=v;Q='';if($('#q'))$('#q').value='';renderRail();renderMain();window.scrollTo({top:0,behavior:'smooth'});}
function renderMain(){
 if(Q){renderSearch();return;}
 if(CUR==='pano'){renderPano();return;}
 if(CUR==='mega'){renderMega();return;}
 if(CUR==='quiz'){renderQuiz();return;}
 const u=UNITS.find(x=>x.id===CUR);
 if(u){renderUnit(u);return;}
 CUR='m1';renderUnit(UNITS[0]);
}

/* ---------- shared card/piece renderers ---------- */
function cardHtml(s){
 return `<button class="card ${s._genai?'genai':''}" data-svc="${esc(s.n)}">
   <div class="card-top"><b>${esc(svcTitle(s))}${s.flag?`<span class="flag">gap</span>`:''}</b><span class="stars">${stars(s.s)}</span></div>
   <p><span class="tagline">${esc(s.t)}</span></p>
 </button>`;
}
function renderDeep(d){
 return `<div class="panel" style="margin-top:12px">
  <h3 style="margin-top:0">${T(d.t)}</h3>
  ${d.groups.map(g=>`<h5 style="font-size:12.5px;color:var(--ink2);margin:12px 0 4px;font-weight:600">${T(g.h)}</h5>
   <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--ink2)">${g.items.map(i=>`<li style="margin:4px 0">${md(i)}</li>`).join('')}</ul>`).join('')}
 </div>`;
}
function treeCardHtml(t){
 return `<div class="tree"><b>${T(t.t)}</b><div class="q">${md(t.q)}</div>
  ${t.rows.map(r=>`<div class="branch">
    <div class="cond">${md(r.c)}</div><div class="arrow">→</div>
    <div class="res ${r.ai?'ai':''}">${esc(r.r)}</div>
    <div class="why-s">${md(r.w)}</div></div>`).join('')}
 </div>`;
}
function cmpCardHtml(c){
 return `<div class="cmp">
  <div class="cmp-t">${T(c.t)}</div><div class="cmp-d">${md(c.d)}</div>
  <div class="tbl-wrap"><table><thead><tr><th></th>${c.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
  <tbody>${c.rows.map(r=>`<tr><th>${esc(r.h)}</th>${r.c.map(x=>`<td>${md(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="tip">${md(c.tip)}</div></div>`;
}
function flowCardHtml(f){
 return `<div class="flow" data-f="${f.id}">
   <b>${T(f.t)}</b><div class="why">${md(f.why)}</div>
   ${f.lanes.map((ln,li)=>`
     ${ln.t?`<div class="lane-t">${T(ln.t)}</div>`:''}
     <div class="chain">${ln.steps.map((st,i)=>
       (i?'<div class="arrow">→</div>':'')+
       `<button class="node" data-f="${f.id}" data-l="${li}" data-i="${i}">${esc(st.n)}</button>`).join('')}</div>`).join('')}
   <div class="flow-cap" id="cap-${f.id}"></div>
 </div>`;
}

/* ---------- structural breakdown diagrams (xtree) ---------- */
function xCard(n){
 const clickable=n.svc&&SVC[n.svc];
 return `<div class="xn-card${n.ai?' ai':''}"${clickable?` data-svc="${esc(n.svc)}" style="cursor:pointer"`:' style="cursor:default"'}>
   <b>${esc(n.n)}</b>${n.s?`<small>${md(n.s)}</small>`:''}</div>`;
}
function xBranches(children){
 if(children.length>4){
   return `<div class="xn-stem"></div><div class="xn-grid">${children.map(c=>xCard(c)).join('')}</div>`;
 }
 return `<div class="xn-row">${children.map(c=>`
   <div class="xn-branch">${xCard(c)}
     ${c.children?`<div class="xn-stem"></div>${xBranches(c.children)}`:''}
   </div>`).join('')}</div>`;
}
function renderXTree(x){
 return `<div class="xtree" data-x="${x.id}"><b>${T(x.t)}</b><div class="why">${md(x.why)}</div>
  <div class="xwrap">
   <div class="xn-root">${xCard(x.root)}</div>
   ${x.root.children?`<div class="xn-stem"></div>${xBranches(x.root.children)}`:''}
  </div>
  ${x.tail?`<div class="xn-tail"><div class="chain">${x.tail.map((st,i)=>(i?'<div class="arrow">→</div>':'')+
    (st.svc&&SVC[st.svc]?`<button class="node" data-x="${x.id}" data-i="${i}" data-svc="${esc(st.svc)}">${esc(st.n)}</button>`
      :`<button class="node" data-x="${x.id}" data-i="${i}">${esc(st.n)}</button>`)).join('')}</div></div>
    <div class="flow-cap" id="xcap-${x.id}"></div>`:''}
 </div>`;
}

/* ---------- unit page ---------- */
function renderUnit(u){
 const prev=UNITS[u._idx-1], next=UNITS[u._idx+1];
 const trees=TREES.filter(t=>ITEM_UNIT[t.id]===u.id);
 const cmps=CMP.filter(c=>ITEM_UNIT[c.id]===u.id);
 const flows=FLOWS.filter(f=>ITEM_UNIT[f.id]===u.id);
 const xtrees=XTREES.filter(x=>ITEM_UNIT[x.id]===u.id);
 const arch=ARCH_DIAGRAMS[u.id]||[];

 let html=`<div class="eyebrow">${T(I18N.unitLabel)} ${u.num}</div>
  <h1>${T(u.t)}</h1>
  <p class="lede">${md(u.sub)}</p>
  ${u.warn?`<div class="note"><b>⚠ </b>${md(u.warn)}</div>`:''}
  <h2>${T(I18N.unitServices)}<i style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3);font-weight:500"> ${u.services.length}</i></h2>
  <div class="cards">${u.services.map(cardHtml).join('')}</div>
  ${u.deep?renderDeep(u.deep):''}`;

 if(trees.length||cmps.length){
   html+=`<h2>${T(I18N.unitConfuse)}</h2>`+trees.map(treeCardHtml).join('')+cmps.map(cmpCardHtml).join('');
 }
 if(arch.length||xtrees.length||flows.length){
   html+=`<h2>${T(I18N.unitDiagram)}</h2>`;
   arch.forEach(a=>{
     html+=`<div class="diagram-card"><div class="diagram-tag"><em>${T(I18N.archTag)}</em></div>
      <div class="diagram-canvas-real">${a.render()}</div>
      <div class="diagram-body"><b>${T(a.t)}</b><p>${md(a.cap)}</p></div></div>`;
   });
   xtrees.forEach(x=>{html+=renderXTree(x);});
   flows.forEach(f=>{html+=flowCardHtml(f);});
 }

 html+=`<div class="unit-nav">
   ${prev?`<button class="prev" data-u="${prev.id}"><span>${T(I18N.prevUnit)}</span><b>${T(prev.t)}</b></button>`:'<span></span>'}
   ${next?`<button class="next" data-u="${next.id}"><span>${T(I18N.nextUnit)}</span><b>${T(next.t)}</b></button>`
     :`<button class="next" data-u="pano"><span>${T(I18N.nextUnit)}</span><b>${T(I18N.views.pano)}</b></button>`}
 </div>`;

 $('#v-main').innerHTML=html;
 $('#v-main').querySelectorAll('.card').forEach(b=>b.onclick=()=>openSvc(b.dataset.svc));
 $('#v-main').querySelectorAll('.xn-card[data-svc]').forEach(b=>b.onclick=()=>openSvc(b.dataset.svc));
 $('#v-main').querySelectorAll('.xtree .chain .node').forEach(b=>{
   if(b.dataset.svc){ b.onclick=()=>openSvc(b.dataset.svc); return; }
   b.onclick=()=>{
     const x=XTREES.find(y=>y.id===b.dataset.x);
     const st=x.tail[+b.dataset.i];
     $('#v-main').querySelectorAll(`.xtree[data-x="${x.id}"] .chain .node`).forEach(n=>n.classList.remove('on'));
     b.classList.add('on');
     document.getElementById('xcap-'+x.id).innerHTML=md(st.note);
   };
 });
 $('#v-main').querySelectorAll('.flow .node').forEach(b=>b.onclick=()=>{
   const f=FLOWS.find(x=>x.id===b.dataset.f);
   const st=f.lanes[+b.dataset.l].steps[+b.dataset.i];
   $('#v-main').querySelectorAll(`.flow[data-f="${f.id}"] .node`).forEach(n=>n.classList.remove('on'));
   b.classList.add('on');
   document.getElementById('cap-'+f.id).innerHTML=md(st.note);});
 $('#v-main').querySelectorAll('.unit-nav button').forEach(b=>b.onclick=()=>go(b.dataset.u));
}

/* ---------- panorama ---------- */

PANO.layers.forEach(l=>l.chips.forEach(c=>{CHIP2SVC[c.l]=c.s;}));
function renderPano(){
 const s=PANO.scenarios.find(x=>x.id===SCEN);
 $('#v-main').innerHTML=`
 <div class="eyebrow">${T(I18N.navSummary)} · Panorama</div>
 <h1>${T(I18N.panoTitle)}</h1>
 <p class="lede">${T(I18N.panoLede)}</p>
 <div class="pano">
   <div class="scen">${PANO.scenarios.map(x=>`<button data-s="${x.id}" class="${x.id===SCEN?'on':''}">${T(x.t)}</button>`).join('')}</div>
   ${SCEN==='all'?`
   <div class="pano-cap" style="margin-bottom:14px">${md(s.cap)}</div>
   ${PANO.layers.map(l=>`
     <div class="layer">
       <div class="layer-h">${l.k}<b>${T(l.t)}</b></div>

     </div>`).join('')}`
   :`
   <div class="pano-cap" style="margin-bottom:16px">${md(s.cap)}</div>
   <div class="chain" style="flex-wrap:wrap;row-gap:10px">${s.path.map((p,i)=>
     (i?'<div class="arrow">→</div>':'')+
     `<button class="node" data-i="${i}">${esc(p)}</button>`).join('')}</div>
   <div class="flow-cap" id="pano-step-cap"></div>`}
 </div>
 <div class="unit-nav">
   <button class="prev" data-u="${UNITS[UNITS.length-1].id}"><span>${T(I18N.prevUnit)}</span><b>${T(UNITS[UNITS.length-1].t)}</b></button>
   <button class="next" data-u="mega"><span>${T(I18N.nextUnit)}</span><b>${T(I18N.megaTitle)}</b></button>
