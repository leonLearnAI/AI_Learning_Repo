<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Architecture Recommender</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-chat: #0d1220;
            --bg-user-msg: #1e3a5f;
            --bg-ai-msg: #1a1f2e;
            --border: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --accent-hover: #7dd3fc;
            --success: #34d399;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Header ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #0a0e17;
            letter-spacing: -1px;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* ===== Chat Area ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* ===== Messages ===== */
        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.user .avatar {
            background: var(--bg-user-msg);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, var(--accent), #818cf8);
            color: #0a0e17;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.65;
            font-size: 14.5px;
            max-width: 680px;
        }

        .message.user .bubble {
            background: var(--bg-user-msg);
            border: 1px solid rgba(56, 189, 248, 0.1);
            color: var(--text-primary);
            border-top-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: var(--bg-ai-msg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-top-left-radius: 4px;
        }

        /* Markdown styles inside AI messages */
        .bubble h1,
        .bubble h2,
        .bubble h3,
        .bubble h4 {
            color: var(--accent);
            margin: 16px 0 8px 0;
            font-weight: 600;
        }

        .bubble h1:first-child,
        .bubble h2:first-child,
        .bubble h3:first-child,
        .bubble h4:first-child {
            margin-top: 0;
        }

        .bubble h3 {
            font-size: 15px;
        }

        .bubble h4 {
            font-size: 14px;
        }

        .bubble p {
            margin: 8px 0;
        }

        .bubble ul,
        .bubble ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .bubble li {
            margin: 4px 0;
        }

        .bubble strong {
            color: var(--accent-hover);
            font-weight: 600;
        }

        .bubble code {
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--accent);
        }

        .bubble pre {
            background: #0a0e17;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .bubble pre code {
            background: none;
            padding: 0;
            font-size: 13px;
            color: var(--text-primary);
        }

        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 13.5px;
        }

        .bubble th,
        .bubble td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .bubble th {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent);
            font-weight: 600;
        }

        /* ===== Welcome Message ===== */
        .welcome {
            max-width: 600px;
            margin: auto;
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.5s ease;
        }

        .welcome-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
            color: #0a0e17;
            font-weight: 700;
        }

        .welcome h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .examples {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .example-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 12px 18px;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.5;
        }

        .example-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--accent-glow);
        }

        /* ===== Typing Indicator ===== */
        .typing-indicator {
            display: flex;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .typing-dots {
            padding: 14px 18px;
            background: var(--bg-ai-msg);
            border: 1px solid var(--border);
            border-radius: 14px;
            border-top-left-radius: 4px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* ===== Input Area ===== */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 120px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border: none;
            color: #0a0e17;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            font-size: 20px;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .input-hint {
            max-width: 800px;
            margin: 8px auto 0;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">AR</div>
            <div class="header-title">
                <h1>AI Architecture Recommender</h1>
                <p>Describe your project, get architecture recommendations</p>
            </div>
        </div>
        <button class="btn-reset" onclick="resetChat()">New Chat</button>
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chatContainer">
        <!-- Welcome screen -->
        <div class="welcome" id="welcome">
            <div class="welcome-icon">AR</div>
            <h2>What are you building?</h2>
            <p>Describe your AI project and I'll recommend the best architecture style, cloud service model, and
                deployment strategy.</p>
            <div class="examples">
                <button class="example-btn" onclick="useExample(this)">
                    I'm building a large-scale NLP chatbot called SmartChat. It needs high scalability, real-time
                    responses, and we have a high budget with strong cloud expertise. Data is sensitive and we prefer
                    hybrid deployment.
                </button>
                <button class="example-btn" onclick="useExample(this)">
                    We're a small startup building a simple prediction tool for sales forecasting. Low budget, small
                    team with no cloud experience, data isn't sensitive, and we'd prefer public cloud.
                </button>
                <button class="example-btn" onclick="useExample(this)">
                    I need to build a computer vision system for quality inspection in a factory. Medium scale, needs
                    real-time processing, medium budget, and data is highly sensitive.
                </button>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea class="input-field" id="userInput" placeholder="Describe your AI project requirements..." rows="1"
                onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">↑</button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcome = document.getElementById('welcome');

        // Auto-resize textarea
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        // Handle Enter key
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Use example prompt
        function useExample(btn) {
            userInput.value = btn.textContent.trim();
            autoResize(userInput);
            sendMessage();
        }

        // Add message to chat
        function addMessage(role, content) {
            // Hide welcome screen
            if (welcome) welcome.style.display = 'none';

            const msg = document.createElement('div');
            msg.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (role === 'assistant') {
                // Render markdown for AI responses
                bubble.innerHTML = marked.parse(content);
            } else {
                bubble.textContent = content;
            }

            msg.appendChild(avatar);
            msg.appendChild(bubble);
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Show typing indicator
        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.style.background = 'linear-gradient(135deg, var(--accent), #818cf8)';
            avatar.style.color = '#0a0e17';
            avatar.textContent = 'AI';

            const dots = document.createElement('div');
            dots.className = 'typing-dots';
            dots.innerHTML = '<span></span><span></span><span></span>';

            typing.appendChild(avatar);
            typing.appendChild(dots);
            chatContainer.appendChild(typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // Send message to backend
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Disable input while waiting
            sendBtn.disabled = true;
            userInput.disabled = true;

            // Show user message
            addMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Show typing indicator
            showTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                const data = await res.json();
                hideTyping();

                if (data.reply) {
                    addMessage('assistant', data.reply);
                } else if (data.error) {
                    addMessage('assistant', '⚠️ Error: ' + data.error);
                }
            } catch (err) {
                hideTyping();
                addMessage('assistant', '⚠️ Connection error. Make sure the server is running.');
            }

            // Re-enable input
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }

        // Reset conversation
        async function resetChat() {
            try {
                await fetch('/reset', { method: 'POST' });
            } catch (e) { }

            // Clear chat UI
            chatContainer.innerHTML = '';

            // Re-add welcome screen
            const welcomeHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">AR</div>
                    <h2>What are you building?</h2>
                    <p>Describe your AI project and I'll recommend the best architecture style, cloud service model, and deployment strategy.</p>
                    <div class="examples">
                        <button class="example-btn" onclick="useExample(this)">
                            I'm building a large-scale NLP chatbot called SmartChat. It needs high scalability, real-time responses, and we have a high budget with strong cloud expertise. Data is sensitive and we prefer hybrid deployment.
                        </button>
                        <button class="example-btn" onclick="useExample(this)">
                            We're a small startup building a simple prediction tool for sales forecasting. Low budget, small team with no cloud experience, data isn't sensitive, and we'd prefer public cloud.
                        </button>
                        <button class="example-btn" onclick="useExample(this)">
                            I need to build a computer vision system for quality inspection in a factory. Medium scale, needs real-time processing, medium budget, and data is highly sensitive.
                        </button>
                    </div>
                </div>
            `;
            chatContainer.innerHTML = welcomeHTML;
            userInput.focus();
        }

        // Focus input on load
        userInput.focus();
    </script>

</body>

</html>
